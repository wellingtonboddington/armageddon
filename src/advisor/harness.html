<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VESPER harness</title>
<!-- dev-only harness for the VESPER advisor module (never shipped) -->
<link rel="stylesheet" href="advisor.css">
<style>
  :root {
    --bg: #0a0a08; --panel: rgba(14, 13, 10, .92); --panel2: #17150f; --line: #3a3524;
    --y: #ffd21f; --y2: #ffb000; --y3: #7a6410;
    --text: #ece6cf; --dim: #8d8670; --red: #ff4433; --cyan: #3ee6ff; --green: #a6e35a;
    --mono: "JetBrains Mono", "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
    --head: "Bahnschrift", "Arial Narrow", "Roboto Condensed", "DejaVu Sans Condensed", sans-serif;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font: 12px/1.4 var(--mono); overflow: hidden;
    background-image:
      linear-gradient(rgba(255, 210, 31, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 210, 31, .035) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  #ctl {
    position: fixed; top: 0; right: 0; bottom: 0; width: 380px; overflow: auto; padding: 12px 14px 40px;
    background: rgba(10, 10, 8, .96); border-left: 1px solid var(--line);
  }
  #ctl h2 { font: 700 11px/1 var(--head); letter-spacing: .2em; color: var(--y); margin: 16px 0 8px; }
  #ctl h2:first-child { margin-top: 2px; }
  #ctl button, #ctl select {
    font: 11px var(--mono); color: var(--text); background: #14130e; border: 1px solid var(--line);
    padding: 3px 6px; margin: 0 4px 4px 0; cursor: pointer;
  }
  #ctl button:hover { border-color: var(--y3); color: var(--y); }
  #ctl button.on { border-color: var(--y); color: var(--y); }
  #ctl label { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--dim); }
  #ctl input[type=range] { flex: 1; accent-color: #ffd21f; }
  #ctl .grp { color: var(--dim); font-size: 10px; letter-spacing: .14em; margin: 8px 0 3px; }
  #status { white-space: pre-wrap; color: var(--dim); font-size: 10px; border: 1px solid var(--line); padding: 6px; min-height: 90px; }
  #stage { position: fixed; left: 0; top: 0; right: 380px; bottom: 0; }
  #advisor-menu { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 500px; }
  #advisor-hud { position: absolute; left: 16px; bottom: 16px; }
  #wire { position: absolute; left: 16px; top: 12px; right: 16px; color: var(--dim); font-size: 10px; letter-spacing: .08em; height: 64px; overflow: hidden; }
  #wire b { color: var(--y); font-weight: 400; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="wire"></div>
  <div id="advisor-menu"></div>
  <div id="advisor-hud"></div>
</div>
<div id="ctl">
  <h2>MODE</h2>
  <div><button data-mode="menu">menu</button><button data-mode="game">game</button><button data-mode="idle">idle</button><button id="reset">reset()</button></div>
  <h2>VOICE</h2>
  <div><button id="voice">voice: ?</button><button id="unlock">unlock audio</button></div>
  <label>volume <input id="vol" type="range" min="0" max="1" step="0.05"></label>
  <label>rate <input id="rate" type="range" min="0.8" max="1.3" step="0.01"></label>
  <label>voice <select id="vsel"><option value="">(auto)</option></select></label>
  <h2>TESTS</h2>
  <div>
    <button id="spam">attack.incoming ×5</button><button id="crit">critical interrupt</button>
    <button id="flood">flood queue</button><button id="rand">random event</button>
    <button id="hintbtn">host hint()</button><button id="sayraw">say()</button><button id="unknown">unknown key</button>
  </div>
  <h2>STATUS</h2>
  <div id="status"></div>
  <h2>EVENTS</h2>
  <div id="events"></div>
</div>
<script src="../js/00_core.js"></script>
<script src="advisor.js"></script>
<script>
(function () {
  'use strict';
  const A = MP.Advisor;
  const SAMPLE = {
    nation: ['Varkos', 'the Ostrel Union', 'Kaldria', 'Meridian Pact', 'Sarn Republic'],
    target: ['Kaldria', 'Sarn Republic', 'Varkos'],
    troops: [8400, 12500, 31000, 142000],
    weapon: ['Airstrike', 'Tactical', 'Hypersonic', 'ICBM', 'MIRV', 'Orbital', 'EMP'],
    eta: [6, 12, 22], count: [3, 6, 12],
    credits: [48000, 125000], uranium: [180, 640], amount: [9200, 31000],
    type: ['City', 'Factory', 'Port', 'Hub', 'Silo', 'Fort', 'Radar'], level: [2, 3, 4],
    reason: ['too close to another factory', 'not your territory', 'needs a coastline'],
    doctrine: ['Iron Curtain', 'Blitz', 'Second Strike'], name: ['Novaya Sarn', 'Halcyon', 'Ostmark'],
    mission: ['Hold the Strait', 'Silent Launch', 'Three Capitals'], item: ['Orbital lance', 'Hardened silos', 'Ghost radar'],
    ending: ['Domination', 'Last Flag Standing', 'Council Mandate'], speed: [2, 4, 0.5],
    resolution: ['Arms Freeze 31-B', 'Embargo on Varkos', 'Neutral Waters Act'],
  };
  const pickS = (a) => a[(Math.random() * a.length) | 0];
  function paramsFor(key) {
    const def = A.lines[key]; const p = {};
    (def.v || []).join(' ').replace(/\{(\w+)\}/g, (m, k) => { if (SAMPLE[k]) p[k] = pickS(SAMPLE[k]); return m; });
    return p;
  }
  window.H = { paramsFor, SAMPLE, log: [] };

  A.init({ hudEl: document.getElementById('advisor-hud'), menuEl: document.getElementById('advisor-menu') });
  A.setMode('menu');

  // wire feed mirror (what the host would do with advisor:line)
  const wire = document.getElementById('wire');
  MP.bus.on('advisor:line', (d) => {
    H.log.push(d);
    const row = document.createElement('div');
    row.innerHTML = '<b>ADVISOR</b> [' + d.priority + '] ' + (d.key || '(say)') + ' — ';
    row.appendChild(document.createTextNode(d.text));
    wire.prepend(row); while (wire.children.length > 5) wire.lastChild.remove();
  });
  MP.bus.on('advisor:speaking', (d) => { H.speaking = d.on; });

  // host loop
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; A.update(dt); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  addEventListener('pointerdown', () => MP.audio.unlock(), { once: true });

  // controls
  const $ = (id) => document.getElementById(id);
  function syncMode() { document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === A.getMode())); $('advisor-menu').classList.toggle('hide', A.getMode() !== 'menu'); $('advisor-hud').classList.toggle('hide', A.getMode() !== 'game'); }
  document.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => { A.setMode(b.dataset.mode); syncMode(); });
  syncMode();
  $('reset').onclick = () => A.reset();
  $('voice').onclick = () => { A.setVoiceEnabled(!A.isVoiceEnabled()); syncVoice(); };
  $('unlock').onclick = () => MP.audio.unlock();
  $('vol').value = A.getVolume(); $('vol').oninput = (e) => A.setVolume(+e.target.value);
  $('rate').value = A.getRate(); $('rate').oninput = (e) => A.setRate(+e.target.value);
  function syncVoice() { $('voice').textContent = 'voice: ' + (A.isVoiceEnabled() ? 'ON' : 'OFF'); }
  syncVoice();
  function fillVoices() {
    const sel = $('vsel'); const cur = A.getVoiceName();
    const vs = A.listVoices(); if (sel.options.length - 1 === vs.length) return;
    sel.length = 1;
    vs.forEach((v) => { const o = document.createElement('option'); o.value = v.name; o.textContent = (v.female ? '♀ ' : '  ') + v.name + ' (' + v.lang + ')'; sel.appendChild(o); });
  }
  $('vsel').onchange = (e) => A.setVoiceName(e.target.value || null);
  setInterval(fillVoices, 1500);
  $('spam').onclick = () => { for (let i = 0; i < 5; i++) A.event('attack.incoming', paramsFor('attack.incoming')); };
  $('crit').onclick = () => { A.event('build.done', paramsFor('build.done')); setTimeout(() => A.event('missile.inbound', paramsFor('missile.inbound')), 600); };
  $('flood').onclick = () => { ['attack.expand', 'build.done', 'econ.rich', 'nation.fell', 'research.started', 'diplo.gift', 'weather.storm'].forEach((k) => A.event(k, paramsFor(k))); };
  const keys = Object.keys(A.lines).filter((k) => k.indexOf('sys.') !== 0);
  $('rand').onclick = () => { const k = pickS(keys); A.event(k, paramsFor(k)); };
  $('hintbtn').onclick = () => A.hint('Place your nation · click any land');
  $('sayraw').onclick = () => A.say('Raw line from the host. Priority two.', { priority: 2, hint: 'host say()' });
  $('unknown').onclick = () => { A.event('no.such.key', {}); A.event('no.such.key2', { text: 'Unknown key with a text param falls back to say().' }); };

  const groups = {};
  keys.forEach((k) => { const g = k.split('.')[0]; (groups[g] = groups[g] || []).push(k); });
  const ev = $('events');
  Object.keys(groups).forEach((g) => {
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = g.toUpperCase(); ev.appendChild(h);
    groups[g].forEach((k) => {
      const b = document.createElement('button'); b.textContent = k.slice(g.length + 1);
      b.title = k + ' · p' + A.lines[k].p; b.onclick = () => A.event(k, paramsFor(k)); ev.appendChild(b);
    });
  });
  setInterval(() => { $('status').textContent = JSON.stringify(A.debugState(), null, 1).slice(0, 1400); }, 400);
})();
</script>
</body>
</html>
