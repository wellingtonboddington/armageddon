        el.innerHTML = `VOICE: <b>${U.esc(d.chosen || 'none')}</b> ${d.chosen ? (v.local ? '<span class="g">OFFLINE</span>' : '<span class="amber">NEEDS INTERNET</span>') : ''} · ${d.voices} installed · ${!d.enabled ? '<span class="red">MUTED</span>' : d.broken ? '<span class="amber">RECOVERING</span>' : d.blocked ? '<span class="amber">WAITING FOR A CLICK</span>' : '<span class="g">READY</span>'}`;
      };
      vstat();
      box.querySelector('#st-vtest').onclick = () => { MP.audio.unlock(); MP.Advisor && MP.Advisor.setVoiceEnabled(true); const cb = box.querySelector('#st-voice'); if (cb) cb.checked = true; MP.Advisor && MP.Advisor.say('Voice check. Channel is clear.', { priority: 2 }); setTimeout(vstat, 1200); setTimeout(vstat, 4000); };
      box.querySelector('#st-fs').onchange = (e) => { S.set('fullscreen', e.target.checked); if (e.target.checked) MP.enterFullscreen(); };
      box.addEventListener('click', (e) => {
        const b = e.target.closest('[data-a]'); if (!b) return;
        const a = b.dataset.a;
        if (a === 'resume') { close(); }
        if (a === 'save') MP.Game.save(false);
        if (a === 'howto') Menu.openHowTo();
        if (a === 'quit') { MP.Game.save(true).then(() => { close(); MP.Game.quitToMenu(); }); }
        if (a === 'reset') MP.HUD.confirm('Reset all progress?', 'Level, scrap, unlocks and records will be erased.', () => { localStorage.removeItem(PKEY); Menu.load(); close(); Menu.render(); });
      });
      const obs = new MutationObserver(() => { if (!box.isConnected) { obs.disconnect(); if (Menu._resumeAfter && MP.Game.running) MP.Game.setPaused(false); } });
      obs.observe(document.getElementById('modal-root'), { childList: true });
    });
  };

  // ---------------- animated wireframe globe ----------------
  Menu.frame = function (dt) {
    if (!globeCv || root.style.display === 'none') return;
    globeT += dt;
    const w = window.innerWidth, hh = window.innerHeight;
    if (globeCv.width !== w || globeCv.height !== hh) { globeCv.width = w; globeCv.height = hh; }
    const c = globeCtx;
    c.clearRect(0, 0, w, hh);
    const R = Math.min(w, hh) * 0.42, cx = w / 2, cy = hh * 0.53;
    const rot = globeT * 0.08;
    c.lineWidth = 1;
    const proj = (lon, lat) => {
      const l = lon + rot, cl = Math.cos(lat);
      const x = cl * Math.sin(l), y = Math.sin(lat), z = cl * Math.cos(l);
      return [cx + x * R, cy - y * R, z];
    };
    c.strokeStyle = 'rgba(255,210,31,0.10)';
    for (let lat = -75; lat <= 75; lat += 15) {
      c.beginPath(); let first = true;
      for (let lon = 0; lon <= 360; lon += 6) { const [x, y, z] = proj(lon * Math.PI / 180, lat * Math.PI / 180); if (z < 0) { first = true; continue; } if (first) { c.moveTo(x, y); first = false; } else c.lineTo(x, y); }
      c.stroke();
    }
    for (let lon = 0; lon < 360; lon += 20) {
      c.beginPath(); let first = true;
      for (let lat = -90; lat <= 90; lat += 6) { const [x, y, z] = proj(lon * Math.PI / 180, lat * Math.PI / 180); if (z < 0) { first = true; continue; } if (first) { c.moveTo(x, y); first = false; } else c.lineTo(x, y); }
      c.stroke();
    }
    c.strokeStyle = 'rgba(255,210,31,0.22)'; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke();
    // satellites / blips
    for (let k = 0; k < 14; k++) {
      const lon = (k * 47 + globeT * (6 + k % 5)) * Math.PI / 180, lat = ((k * 31) % 140 - 70) * Math.PI / 180;
      const [x, y, z] = proj(lon, lat);
      if (z < 0) continue;
      c.fillStyle = `rgba(255,210,31,${0.25 + 0.4 * z})`; c.beginPath(); c.arc(x, y, 2 + z * 2, 0, 7); c.fill();
    }
    // occasional arc (missile trail across the globe)
    const ph = (globeT % 7) / 7;
    if (ph < 0.6) {
      const a0 = proj(0.9, 0.7), a1 = proj(2.0, -0.2);
      if (a0[2] > 0 && a1[2] > 0) {
        c.strokeStyle = 'rgba(255,68,51,0.35)'; c.beginPath(); c.moveTo(a0[0], a0[1]);
        const mx = (a0[0] + a1[0]) / 2, my = Math.min(a0[1], a1[1]) - R * 0.35;
        const k = ph / 0.6;
        for (let s = 0; s <= 20; s++) { const t = s / 20 * k; const x = (1 - t) * (1 - t) * a0[0] + 2 * (1 - t) * t * mx + t * t * a1[0]; const y = (1 - t) * (1 - t) * a0[1] + 2 * (1 - t) * t * my + t * t * a1[1]; c.lineTo(x, y); }
        c.stroke();
      }
    }
  };
})();

/* MIDNIGHT PROTOCOL — boot sequence and main loop */
(function () {
  'use strict';
  const MP = window.MP, C = MP.CONFIG;
  MP.FONT_MONO = '"JetBrains Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace';
  MP.FONT_HEAD = 'Bahnschrift,"Arial Narrow","Roboto Condensed","DejaVu Sans Condensed",Impact,sans-serif';

  const bootLines = [];
  function bootLog(text) {
    const el = document.getElementById('boot-log');
    if (!el) return;
    bootLines.push(text);
    el.textContent = bootLines.slice(-7).join('\n');
  }
  const frame = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));

  async function boot() {
    try {
      bootLog('> MIDNIGHT PROTOCOL // LOCAL NODE');
      bootLog('> DECODING COASTLINES ............');
      await frame();
      const t0 = performance.now();
      MP.World.load();
      bootLog(`> ${MP.World.landTotal.toLocaleString()} LAND TILES · ${MP.World.deposits.length} URANIUM DEPOSITS · ${Math.round(performance.now() - t0)}ms`);
      bootLog('> CHARTING SEA LANES · RAISING TERRAIN');
      await frame();
      MP.HUD.init();
      document.getElementById('hud').style.display = 'none';
      bootLog('> RASTERISING FLAGS · ' + MP.Flags.list.length + ' NATIONS ON FILE');
      await frame();
      MP.Menu.init();
      MP.Menu.advEl = document.createElement('div');
      MP.Menu.advEl.id = 'advisor-menu';
      if (MP.Advisor && MP.Advisor.init) {
        try { MP.Advisor.init({ hudEl: document.getElementById('advisor-hud'), menuEl: MP.Menu.advEl }); } catch (e) { console.error('[advisor init]', e); }
      }
      MP.Menu.render();
      document.getElementById('menu').style.display = 'none';
      bootLog('> INTELLIGENCE ADVISOR · ONLINE');
      bootLog('> ALL SYSTEMS LOCAL · NO UPLINK REQUIRED');
      const go = document.getElementById('boot-go');
      go.style.display = '';
      const start = () => {
        window.removeEventListener('keydown', start);
        document.getElementById('boot').removeEventListener('click', start);
        MP.audio.unlock();
        if (MP.settings.get('fullscreen', true)) MP.enterFullscreen();
        MP.SFX.play('phase');
        const b = document.getElementById('boot');
        b.classList.add('out');
        setTimeout(() => b.remove(), 600);
        MP.Menu.show();
        const P = MP.Menu.profile();
        if (P.firstBoot) { P.firstBoot = false; MP.Menu.save(); }
      };
      document.getElementById('boot').addEventListener('click', start);
      window.addEventListener('keydown', start);
      MP.booted = true;
      requestAnimationFrame(loop);
    } catch (e) {
      console.error(e);
      bootLog('! BOOT FAILURE: ' + (e && e.message));
    }
  }

  let last = performance.now(), acc = 0;
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;
    const Game = MP.Game;
    try {
      if (Game.running && MP.G.S) {
        if (!Game.paused) {
          acc += dt * Game.speed;
          let steps = 0;
          const t0 = performance.now();
          while (acc >= C.TICK && steps < 16) {
            Game.tick(C.TICK);
            acc -= C.TICK; steps++;
            if (performance.now() - t0 > 40) { acc = Math.min(acc, C.TICK); break; } // never freeze the frame
          }
        }
        MP.Render.frame(dt);
        MP.HUD.frame(dt);
      } else {
        MP.Menu.frame(dt);
      }
    } catch (e) {
      console.error('[loop]', e);
      if (!loop._errShown) { loop._errShown = true; MP.HUD && MP.HUD.toast('Internal error: ' + e.message, 'bad'); setTimeout(() => { loop._errShown = false; }, 5000); }
    }
    // the advisor runs isolated: a fault there never stops the game (and vice versa)
    try { if (MP.Advisor && MP.Advisor.update) MP.Advisor.update(dt); } catch (e) { if (!loop._advErr) { loop._advErr = true; console.error('[advisor]', e); } }
    requestAnimationFrame(loop);
  }
  // last-resort error boundary: log, tell the player once, keep running
  let errShown = 0;
  const report = (msg) => { console.error('[MP]', msg); if (Date.now() - errShown > 8000 && MP.HUD && MP.HUD.toast) { errShown = Date.now(); try { MP.HUD.toast('Recovered from an internal error', 'bad'); } catch (e) { /* */ } } };
  window.addEventListener('error', (e) => report(e && (e.message || e.error)));
  window.addEventListener('unhandledrejection', (e) => report(e && e.reason));

  // auto-pause + save when the tab is hidden (handy for spotty connections / switching apps)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && MP.Game.running && !MP.Game.paused && MP.G.S && MP.G.S.phase === 'play' && MP.G.S.opts.mode !== 'watch') {
      MP.Game.setPaused(true);
    }
  });
  window.addEventListener('beforeunload', () => { if (MP.Game.running && MP.G.S && MP.G.S.phase === 'play') { try { MP.Game.save(true); } catch (e) { /* */ } } MP.settings.flush(); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
