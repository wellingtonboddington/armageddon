<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Protocol</title>
<meta name="description" content="MIDNIGHT PROTOCOL — an offline real-time grand strategy game of territory, trade, diplomacy and nuclear brinkmanship.">

<style>
/* ==== src/css/main.css ==== */
/* MIDNIGHT PROTOCOL — hazard yellow / black tactical theme */
:root {
  --bg: #0a0a08; --panel: rgba(14, 13, 10, .92); --panel2: #17150f; --line: #3a3524; --line2: #57502f;
  --y: #ffd21f; --y2: #ffb000; --y3: #7a6410; --text: #ece6cf; --dim: #8d8670; --red: #ff4433; --cyan: #3ee6ff; --green: #a6e35a;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --head: Bahnschrift, "Arial Narrow", "Roboto Condensed", "DejaVu Sans Condensed", Impact, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #060709; color: var(--text); font: 12px/1.35 var(--mono); overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; }
img.ico, svg.ico { width: 14px; height: 14px; vertical-align: -2px; image-rendering: auto; }
.dim { color: var(--dim); } .red { color: var(--red); } .amber { color: var(--y2); } .y { color: var(--y); } .g { color: var(--green); }
#map { position: fixed; inset: 0; display: block; cursor: crosshair; }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); position: relative; backdrop-filter: blur(2px); }
.brk::before, .brk::after { content: ""; position: absolute; width: 8px; height: 8px; pointer-events: none; }
.brk::before { left: -1px; top: -1px; border-left: 2px solid var(--y); border-top: 2px solid var(--y); }
.brk::after { right: -1px; bottom: -1px; border-right: 2px solid var(--y); border-bottom: 2px solid var(--y); }
.ph { display: flex; justify-content: space-between; align-items: center; padding: 6px 9px 4px; font-size: 10px; letter-spacing: .12em; color: var(--dim); }
.ph .t { color: var(--y); }
.tag { color: var(--y2); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
.bar { position: relative; height: 4px; background: #24211a; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--y); transition: width .2s; }

.btn { background: #1b1912; border: 1px solid var(--line2); color: var(--text); padding: 6px 12px; cursor: pointer; letter-spacing: .08em; font-size: 11px; text-transform: uppercase; position: relative; }
.btn:hover { border-color: var(--y); color: #fff; background: #25220f; }
.btn:active { transform: translateY(1px); }
.btn.sm { padding: 3px 7px; font-size: 10px; }
.btn.on { background: var(--y); color: #0a0a08; border-color: var(--y); }
.btn.primary { background: var(--y); color: #0a0a08; border-color: var(--y); font-weight: 700; }
.btn.primary:hover { background: #ffe061; }
.btn.danger { background: #7a1a10; border-color: #b8321f; color: #ffd9d2; }
.btn.danger:hover { background: #a2261a; }
.btn.icon { padding: 5px 7px; }
.btn.icon img.ico { width: 16px; height: 16px; }
.btn.wide { display: block; width: 100%; margin-top: 8px; }

/* ---------- HUD layout ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#hud > div > *, #hud .radial, #hud .council, #hud .tip { pointer-events: auto; }
.hud-tl { position: absolute; left: 10px; top: 10px; width: 300px; display: flex; flex-direction: column; gap: 6px; }
.hud-tr { position: absolute; right: 10px; top: 10px; width: 310px; display: flex; flex-direction: column; gap: 6px; }
.hud-bl { position: absolute; left: 10px; bottom: 10px; width: 360px; display: flex; flex-direction: column; gap: 6px; }
.hud-bc { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hud-r { position: absolute; right: 10px; bottom: 10px; width: 260px; display: flex; flex-direction: column; gap: 6px; }
.hud-tc { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hud-tc > * { pointer-events: auto; }

.status { padding: 7px 10px; }
.st-row1 { display: flex; gap: 10px; align-items: baseline; }
.defcon { font: 900 17px/1 var(--head); letter-spacing: .04em; color: #6fb8ff; }
.defcon.d4 { color: #a6e35a; } .defcon.d3 { color: var(--y); } .defcon.d2 { color: #ff8c2a; } .defcon.d1 { color: var(--red); animation: blink 1s steps(2) infinite; }
.defcon.flash { animation: dflash 1.2s; }
@keyframes dflash { 0%, 40%, 80% { text-shadow: 0 0 14px currentColor; transform: scale(1.12); } 20%, 60%, 100% { text-shadow: none; transform: none; } }
@keyframes blink { 50% { opacity: .45; } }
.date { color: var(--dim); font-size: 11px; letter-spacing: .1em; }
.st-row2 { display: flex; gap: 10px; margin-top: 6px; font-size: 12px; }
.st-row2 .chip { display: inline-flex; gap: 4px; align-items: center; }
.st-row2 b { font-weight: 600; }
.clock b.red { color: var(--red); animation: blink 1s steps(2) infinite; } .clock b.amber { color: var(--y2); }
.peace b { color: #6fb8ff; }
.landbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.landbar .bar { flex: 1; height: 5px; overflow: visible; }
.landbar .ms { position: absolute; top: -3px; width: 1px; height: 11px; background: var(--dim); }
.landbar b { min-width: 42px; text-align: right; white-space: nowrap; }
.readout { padding: 6px 10px; font-size: 11px; min-height: 44px; }
.readout .ro-1 { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readout #h-terrain { color: var(--text); letter-spacing: .06em; }
.pips i { display: inline-block; width: 7px; height: 7px; background: #333; margin-left: 2px; }
.pips i.on { background: var(--y); }
.ro-2 { margin-top: 3px; white-space: nowrap; overflow: hidden; }
.ro-2 .dug { color: var(--y2); } .ro-2 .soft { color: var(--green); }
.ro-allies { margin-top: 3px; }
.tl-buttons { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.speed { display: inline-flex; gap: 2px; }

img.flag { width: 24px; height: 16px; vertical-align: -3px; border: 1px solid rgba(0, 0, 0, .6); image-rendering: auto; }
img.flag.xs { width: 16px; height: 11px; vertical-align: -1px; }
img.flag.sm { width: 21px; height: 14px; }
img.flag.lg { width: 60px; height: 40px; }
img.flag.xl { width: 96px; height: 64px; }

.lb { padding-bottom: 4px; font-size: 11px; }
.lb-head, .lbr { display: grid; grid-template-columns: 34px 1fr 50px 50px; padding: 2px 9px; align-items: center; }
.lb-head { color: var(--dim); font-size: 10px; padding-top: 6px; }
.lbr span:nth-child(3), .lbr span:nth-child(4), .lb-head span:nth-child(3), .lb-head span:nth-child(4) { text-align: right; }
.lbr .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbr .nm i { color: var(--dim); font-style: normal; font-size: 9px; }
.lbr.me { color: var(--y); font-weight: 700; background: rgba(255, 210, 31, .07); }
.lbr.partner { color: var(--cyan); }
.attacks .atr { display: grid; grid-template-columns: 1fr 54px 66px; gap: 6px; align-items: center; padding: 4px 9px; border-top: 1px solid #221f16; }
.atr .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .atr .tr { text-align: right; }
.attacks .atr.in { background: rgba(255, 68, 51, .06); }
.attacks .atr.in .nm { color: #ffb3a8; }
.attacks .def { color: var(--cyan); font-style: normal; font-size: 10px; }
.attacks .defend { border-color: var(--cyan); color: var(--cyan); }
.target-chip { padding: 6px 9px; font-size: 11px; display: flex; gap: 6px; align-items: center; border-color: var(--red); }
.target-chip .t { color: var(--red); letter-spacing: .1em; font-size: 10px; }
.target-chip b { flex: 1; }
.effects .efr { display: flex; justify-content: space-between; padding: 2px 9px 4px; font-size: 11px; }

/* advisor + wire */
#advisor-hud { min-height: 84px; }
.wire { font-size: 10.5px; }
#h-wire { padding: 0 8px 6px; }
.wi { display: grid; grid-template-columns: 14px 36px auto minmax(0, 1fr); gap: 5px; align-items: baseline; padding: 1px 0; overflow: hidden; }
.wi .wt { color: #5f5a47; } .wi .wx { color: #cfc8ae; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wi .wtag { font-weight: 700; letter-spacing: .05em; }
.tag-flash { color: #ff8c2a; } .tag-cable { color: #c49bff; } .tag-radar { color: var(--red); } .tag-imint { color: var(--y2); } .tag-osint { color: #7fd1ff; } .tag-advisor { color: var(--y); } .tag-council { color: var(--cyan); }
.wi.bad .wx, .wi.radar .wx { color: #ffb3a8; } .wi.good .wx { color: #d5f5b0; } .wi.embargo .wx { color: #ffd38a; } .wi.betray .wx { color: #ff7e6e; }

/* build bar + stats */
.buildbar { display: flex; gap: 4px; }
.bslot, .dslot, .wslot { width: 50px; height: 50px; background: #15130d; border: 1px solid var(--line2); position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
.bslot:hover, .dslot:hover, .wslot:hover { border-color: var(--y); background: #221f12; }
.bslot.on, .dslot.on, .wslot.on { border-color: var(--y); box-shadow: 0 0 0 1px var(--y), 0 0 12px rgba(255, 210, 31, .35); }
.bslot .k, .dslot .k, .wslot .k { position: absolute; left: 3px; top: 1px; font-size: 8px; color: var(--dim); }
.bslot .gl, .dslot .gl, .wslot .gl { width: 22px; height: 22px; margin-top: -4px; }
.bslot .c, .dslot .c, .wslot .c { position: absolute; bottom: 2px; font-size: 8px; letter-spacing: -.02em; color: var(--y); white-space: nowrap; }
.bslot.poor .c, .dslot.poor .c, .wslot.poor .c { color: var(--red); }
.stats { display: flex; gap: 0; padding: 0; }
.stat { padding: 7px 12px; border-left: 1px solid #221f16; min-width: 120px; }
.stat:first-child { border-left: 0; }
.stat .sl { font-size: 10px; color: var(--dim); letter-spacing: .1em; display: flex; gap: 6px; align-items: center; }
.stat .sl .pos { color: var(--green); margin-left: auto; } .stat .sl .neg { color: var(--red); margin-left: auto; } .stat .sl .pct { color: var(--red); margin-left: auto; }
.stat .sv { font-size: 18px; font-weight: 700; margin: 2px 0 4px; } .stat .sv.sm { font-size: 13px; margin: 1px 0; }
.stat.troops .bar > i { background: linear-gradient(90deg, #ff6b2b, var(--y)); }
.stat.attack { min-width: 290px; }
.presets { display: flex; gap: 2px; margin: 4px 0; }
.presets .btn { padding: 4px 7px; }
.send { font-size: 11px; color: var(--red); }
.stat.res .u { color: var(--y); } .stat.res .u.capped { color: var(--red); }
.ubar { height: 3px; } .ubar > i { background: var(--y2); }

/* dock */
.dock .dock-row { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 6px 6px; }
.dslot, .wslot { width: 46px; height: 46px; }
.wslot .lock { display: none; position: absolute; right: 2px; top: 1px; font-size: 8px; }
.wslot.locked .lock { display: block; }
.wslot.locked .gl { opacity: .5; }
.wslot.sealed { opacity: .38; }
.wslot .prog { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--cyan); width: 0; }
.launchall { margin: 0 6px 6px; width: calc(100% - 12px); border-color: #7a2418; }
.launchall.on { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 12px rgba(255, 68, 51, .5); }
.minimap { padding: 4px; }
.minimap canvas { display: block; width: 100%; height: auto; cursor: pointer; image-rendering: auto; }

/* banner, toasts, tips */
.banner { background: var(--panel); border: 1px solid var(--y); color: var(--text); padding: 6px 12px; display: flex; gap: 12px; align-items: center; font-size: 12px; letter-spacing: .05em; }
.banner.red { border-color: var(--red); }
.banner .x { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 13px; }
#h-toasts { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.toast { background: rgba(14, 13, 10, .95); border-left: 3px solid var(--y); padding: 6px 12px; font-size: 12px; transition: opacity .5s, transform .5s; }
.toast.bad { border-color: var(--red); } .toast.good { border-color: var(--green); } .toast.info { border-color: var(--cyan); }
.toast.out { opacity: 0; transform: translateY(-6px); }
.tip { position: fixed; z-index: 30; width: 280px; background: rgba(12, 11, 8, .97); border: 1px solid var(--line2); padding: 8px 10px; font-size: 11px; pointer-events: none !important; }
.order-float { position: fixed; z-index: 20; transform: translateX(-50%); background: rgba(14, 13, 10, .9); border: 1px solid var(--green); color: var(--text); border-radius: 12px; padding: 3px 12px; font-size: 11px; pointer-events: none; transition: opacity .6s; }
.order-float.out { opacity: 0; }

/* offers */
#h-offers { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.offer { display: flex; align-items: center; gap: 6px; padding: 6px; }
.offer .of-l { display: flex; gap: 8px; align-items: center; padding: 0 6px; min-width: 210px; }
.offer .of-l .ico { width: 22px; height: 22px; }
.offer .of-n { font-weight: 700; color: var(--cyan); }
.offer .of-k { font-size: 10px; color: var(--dim); letter-spacing: .1em; }
.offer .of-bar { height: 3px; background: #222; margin-top: 4px; position: relative; }
.offer .of-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); }
.offer .accept { background: var(--y); color: #0a0a08; border-color: var(--y); font-weight: 700; }

/* radial */
.radial { position: fixed; z-index: 15; width: 0; height: 0; }
.radial::before { content: ""; position: absolute; left: -128px; top: -128px; width: 256px; height: 256px; border-radius: 50%; background: radial-gradient(circle, rgba(10, 10, 8, .85) 55%, rgba(10, 10, 8, .55) 70%, transparent 71%); border: 1px solid var(--line2); }
.radial .rchip { position: absolute; left: 0; top: -150px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--y); padding: 3px 10px; white-space: nowrap; font-size: 11px; color: var(--y); }
.radial .rc { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: #15130d; border: 1px solid var(--line2); cursor: pointer; }
.radial .ropt { position: absolute; transform: translate(-50%, -50%); width: 64px; height: 50px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--text); }
.radial .ropt img { width: 22px; height: 22px; }
.radial .ropt:hover { color: var(--y); }
.radial .ropt:hover img { filter: drop-shadow(0 0 4px var(--y)); }
.radial .ropt.dis { opacity: .3; }

/* council */
.council { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); width: 380px; padding: 4px 14px 12px; z-index: 12; text-align: center; border-color: var(--cyan); }
.council h3 { margin: 4px 0; font: 800 18px var(--head); letter-spacing: .05em; color: var(--cyan); }
.council p { margin: 4px 0; font-size: 11.5px; }
.cc-bar { height: 3px; background: #222; margin: 8px 0; position: relative; } .cc-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); }
.cc-votes { display: flex; gap: 6px; justify-content: center; }
.cc-votes .yes.on { background: var(--green); color: #000; } .cc-votes .no.on { background: var(--red); color: #fff; }
.cc-result { font: 800 22px var(--head); margin: 6px 0; } .cc-result.pass { color: var(--green); } .cc-result.fail { color: var(--red); }

.pause { position: fixed; inset: 0; z-index: 8; background: rgba(0, 0, 0, .35); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none !important; }
.pause .pz { font: 900 54px var(--head); letter-spacing: .3em; color: var(--y); text-shadow: 0 0 20px rgba(255, 210, 31, .4); }
.pause .pzs { color: var(--dim); letter-spacing: .3em; }

/* ---------- modals ---------- */
#modal-root { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.modal-wrap { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; pointer-events: auto; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.modal { width: min(760px, 94vw); max-height: 90vh; overflow: auto; padding: 18px 22px; border-color: var(--line2); }
.modal .mclose { position: absolute; right: 12px; top: 12px; }
.modal h2 { margin: 4px 0 8px; font: 800 22px var(--head); letter-spacing: .06em; }
.modal h3 { font: 800 16px var(--head); letter-spacing: .06em; margin: 12px 0 8px; }
.modal h4 { color: var(--y); letter-spacing: .12em; margin: 16px 0 6px; font-size: 11px; }
.modal p { margin: 4px 0; }
.modal .small { font-size: 10.5px; }
.row-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.kv { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #221f16; }
.kv > span { color: var(--dim); width: 130px; letter-spacing: .1em; font-size: 11px; }
.kv > b { flex: 1; text-align: right; }
.ni-head { display: flex; gap: 14px; align-items: center; }
.ni-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.ni-grid > div { background: #15130d; border: 1px solid #221f16; padding: 6px 8px; }
.ni-grid span { display: block; color: var(--dim); font-size: 10px; } .ni-grid b { font-size: 14px; }
.ni-list { margin-top: 8px; font-size: 11px; } .ni-list > span { color: var(--dim); margin-right: 8px; letter-spacing: .1em; }
.gift-row { display: flex; gap: 8px; margin: 8px 0; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.card { background: #15130d; border: 1px solid var(--line2); padding: 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--y); background: #221f12; }
.card b { color: var(--y); font: 800 15px var(--head); letter-spacing: .05em; }

/* end screen */
.end h1 { font: 900 40px var(--head); letter-spacing: .1em; margin: 4px 0; color: var(--y); }
.end.lose h1 { color: var(--red); } .end.winter h1 { color: #b8c7d6; }
.end-top { display: flex; gap: 18px; align-items: center; }
.end-portrait { width: 140px; height: 140px; border: 1px solid var(--line2); background: #000; image-rendering: pixelated; flex: none; }
.end-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.end-grid > div { background: #15130d; border: 1px solid #221f16; padding: 6px 8px; }
.end-grid span { display: block; color: var(--dim); font-size: 10px; } .end-grid b { font-size: 15px; }
.end-xp { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; color: var(--y); }
.end-xp .bar { height: 6px; }
.newend { color: var(--cyan); letter-spacing: .1em; }

/* ---------- menu ---------- */
#menu { position: fixed; inset: 0; z-index: 10; background: radial-gradient(ellipse at 50% 45%, #15130b 0%, #070706 65%); overflow: hidden; }
#m-globe { position: absolute; inset: 0; }
.m-scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px); }
.m-tl { position: absolute; left: 18px; top: 18px; width: 330px; display: flex; flex-direction: column; gap: 10px; }
.m-card { display: flex; gap: 12px; align-items: center; padding: 9px 12px; cursor: pointer; text-align: left; width: 100%; }
.m-card:hover { border-color: var(--y); }
.m-card .mflag { width: 66px; height: 44px; }
.m-card b { font: 800 16px var(--head); letter-spacing: .05em; }
.m-card .lv { color: var(--y); font-size: 11px; display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.m-card .lv .bar { width: 130px; }
.m-party { padding: 12px 14px; }
.m-party h3 { margin: 2px 0 10px; font: 800 20px var(--head); letter-spacing: .06em; }
.party-slots { display: flex; flex-direction: column; gap: 6px; }
.ps { display: flex; gap: 10px; align-items: center; background: #15130d; border: 1px solid var(--line2); padding: 8px 10px; cursor: pointer; text-align: left; }
.ps b { display: block; } .ps span { font-size: 10px; color: var(--dim); }
.ps.empty { justify-content: center; background: repeating-linear-gradient(-45deg, #1b170a 0 10px, #0f0d07 10px 20px); color: var(--y); font-weight: 700; letter-spacing: .1em; border-color: var(--y3); }
.ps:hover { border-color: var(--y); }
.pt-toggle { display: block; margin-top: 10px; font-size: 11px; cursor: pointer; }

/* ==== src/advisor/advisor.css ==== */
/* MIDNIGHT PROTOCOL — VESPER advisor. Every selector is .vsp- prefixed; colours come from the host palette. */
.vsp, .vsp *, .vsp *::before, .vsp *::after { box-sizing: border-box; }
.vsp {
  position: relative;
  color: var(--text, #ece6cf);
  font-family: var(--mono, "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
.vsp-cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
@supports (image-rendering: pixelated) { .vsp-cv { image-rendering: pixelated; } }

/* ---------------------------------------------------------------- HUD radio panel */
.vsp-hud {
  display: flex; align-items: stretch; gap: 10px;
  width: 350px; max-width: 100%;
  padding: 8px 10px 8px 8px;
  background: var(--panel, rgba(14, 13, 10, .92));
  border: 1px solid var(--line, #3a3524);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
  transition: border-color .25s;
}
.vsp-hud::before { /* hazard tape tab */
  content: ""; position: absolute; left: -1px; top: -1px; width: 58px; height: 3px;
  background: repeating-linear-gradient(135deg, var(--y, #ffd21f) 0 4px, #000 4px 8px);
}
.vsp-hud::after { /* cut corner tick */
  content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px;
  border-right: 1px solid var(--y3, #7a6410); border-bottom: 1px solid var(--y3, #7a6410);
}
.vsp-pf {
  position: relative; flex: 0 0 auto; width: 68px; height: 68px; padding: 1px;
  background: #050504; border: 1px solid var(--y3, #7a6410);
  transition: border-color .25s;
}
.vsp-pf .vsp-cv { width: 64px; height: 64px; }
.vsp-tick { position: absolute; width: 5px; height: 5px; border: 0 solid var(--y, #ffd21f); pointer-events: none; }
.vsp-tick.vsp-c-tl { left: -2px; top: -2px; border-left-width: 1px; border-top-width: 1px; }
.vsp-tick.vsp-c-tr { right: -2px; top: -2px; border-right-width: 1px; border-top-width: 1px; }
.vsp-tick.vsp-c-bl { left: -2px; bottom: -2px; border-left-width: 1px; border-bottom-width: 1px; }
.vsp-tick.vsp-c-br { right: -2px; bottom: -2px; border-right-width: 1px; border-bottom-width: 1px; }
.vsp-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.vsp-head { display: flex; align-items: center; gap: 6px; height: 16px; margin: 0 0 4px; white-space: nowrap; }
.vsp-dot {
  flex: none; width: 7px; height: 7px; border-radius: 50%;
  background: var(--y, #ffd21f); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6);
}
.vsp-name {
  font-family: var(--head, "Bahnschrift", "Arial Narrow", "Roboto Condensed", "DejaVu Sans Condensed", sans-serif);
  font-weight: 700; font-size: 13px; line-height: 1; letter-spacing: .16em; color: var(--y, #ffd21f);
}
.vsp-role {
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
  font-size: 10px; letter-spacing: .12em; color: var(--dim, #8d8670);
}
.vsp-bars { flex: none; margin-left: auto; display: flex; align-items: flex-end; gap: 2px; height: 12px; }
.vsp-bars i { display: block; width: 3px; background: var(--y3, #7a6410); transform-origin: 50% 100%; }
.vsp-bars i:nth-child(1) { height: 4px; }
.vsp-bars i:nth-child(2) { height: 6px; }
.vsp-bars i:nth-child(3) { height: 8px; }
.vsp-bars i:nth-child(4) { height: 10px; }
.vsp-bars i:nth-child(5) { height: 12px; opacity: .45; }
.vsp-spk {
  flex: none; display: grid; place-items: center; width: 20px; height: 18px; margin: 0 0 0 2px; padding: 0;
  appearance: none; -webkit-appearance: none; cursor: pointer;
  color: var(--y, #ffd21f); background: transparent; border: 1px solid var(--line, #3a3524); border-radius: 0;
}
.vsp-spk:hover { border-color: var(--y3, #7a6410); background: rgba(255, 210, 31, .08); }
.vsp-spk:focus-visible { outline: 1px solid var(--y, #ffd21f); outline-offset: 1px; }
.vsp-spk svg { width: 14px; height: 14px; overflow: visible; }
.vsp-ic-body { fill: currentColor; }
.vsp-ic-on, .vsp-ic-off { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: square; }
.vsp-ic-off { display: none; }
.vsp-off .vsp-spk { color: var(--dim, #8d8670); }
.vsp-off .vsp-ic-on { display: none; }
.vsp-off .vsp-ic-off { display: inline; }

.vsp-line {
  height: 54px; overflow: hidden;
  font-size: 13px; line-height: 18px; color: var(--text, #ece6cf);
  overflow-wrap: break-word; transition: color .4s;
}
.vsp-rest { visibility: hidden; }
.vsp-caret { display: inline-block; position: relative; width: 0; height: 1em; vertical-align: -2px; }
.vsp-caret::after {
  content: ""; position: absolute; left: 1px; top: 0; width: .55em; height: 1.05em;
  background: var(--y, #ffd21f); opacity: .85;
  animation: vsp-caret 1.05s steps(1) infinite;
}
.vsp-talk .vsp-caret::after { animation: none; opacity: .9; }
.vsp-stale .vsp-caret::after { display: none; }
.vsp-hint {
  height: 12px; margin-top: 3px;
  font-size: 10px; line-height: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--y3, #7a6410); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .3s;
}
.vsp-hint > span { display: inline-block; white-space: nowrap; }
.vsp-hint.vsp-marq { text-overflow: clip; }
.vsp-hint.vsp-marq > span { animation: vsp-marq var(--vsp-mdur, 6s) ease-in-out infinite alternate; }
.vsp-stale .vsp-line, .vsp-stale .vsp-mline { color: var(--dim, #8d8670); }

/* ---------------------------------------------------------------- CRT overlay + alert tint */
.vsp-scan, .vsp-tint {
  position: absolute; top: 1px; left: 1px; right: 1px; bottom: 1px; pointer-events: none; overflow: hidden;
}
.vsp-scan {
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, .3) 0, rgba(0, 0, 0, .3) 1px, rgba(0, 0, 0, 0) 1px, rgba(0, 0, 0, 0) 3px),
    radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, .42) 100%);
  animation: vsp-flicker 4.7s steps(1) infinite;
}
.vsp-scan::after { /* slow rolling refresh band */
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 38%;
  background: linear-gradient(180deg, rgba(255, 210, 31, 0), rgba(255, 210, 31, .055), rgba(255, 210, 31, 0));
  transform: translateY(-110%); animation: vsp-roll 6.5s linear infinite;
}
.vsp-tint { background: var(--red, #ff4433); opacity: 0; mix-blend-mode: multiply; }
.vsp-glitch .vsp-tint { animation: vsp-redflash .7s steps(1) 1; }
.vsp-glitch .vsp-cv { animation: vsp-jitter .7s steps(1) 1; }

/* ---------------------------------------------------------------- states */
.vsp-talk .vsp-dot { animation: vsp-pulse .9s ease-in-out infinite; }
.vsp-talk .vsp-bars i { background: var(--y, #ffd21f); opacity: 1; animation: vsp-eq .44s ease-in-out infinite alternate; }
.vsp-talk .vsp-bars i:nth-child(2) { animation-duration: .36s; animation-delay: -.11s; }
.vsp-talk .vsp-bars i:nth-child(3) { animation-duration: .52s; animation-delay: -.27s; }
.vsp-talk .vsp-bars i:nth-child(4) { animation-duration: .31s; animation-delay: -.05s; }
.vsp-talk .vsp-bars i:nth-child(5) { animation-duration: .47s; animation-delay: -.33s; }
.vsp-warn .vsp-dot { background: var(--y2, #ffb000); }
.vsp-warn .vsp-hint { color: var(--y2, #ffb000); }
.vsp-crit.vsp-hud { border-color: rgba(255, 68, 51, .75); }
.vsp-crit .vsp-pf, .vsp-crit .vsp-frame { border-color: var(--red, #ff4433); }
.vsp-crit .vsp-dot { background: var(--red, #ff4433); }
.vsp-crit .vsp-bars i, .vsp-crit .vsp-blocks i { background: var(--red, #ff4433); }
.vsp-crit .vsp-hint { color: var(--red, #ff4433); }
.vsp-crit .vsp-tick, .vsp-crit .vsp-brk { border-color: var(--red, #ff4433); }
.vsp-crit .vsp-caret::after { background: var(--red, #ff4433); }

/* ---------------------------------------------------------------- main-menu presence */
.vsp-menu { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 9px 9px 0; text-align: center; }
.vsp-frame {
  position: relative; width: 272px; height: 272px; padding: 7px;
  background: #050504; border: 1px solid var(--line, #3a3524);
  box-shadow: inset 0 0 0 1px #000, 0 0 28px rgba(255, 210, 31, .05);
  transition: border-color .25s;
}
.vsp-frame .vsp-cv { width: 256px; height: 256px; }
.vsp-frame .vsp-scan, .vsp-frame .vsp-tint { top: 7px; left: 7px; right: 7px; bottom: 7px; }
.vsp-frame .vsp-scan {
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, .26) 0, rgba(0, 0, 0, .26) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 4px),
    radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, .45) 100%);
}
.vsp-brk { position: absolute; width: 24px; height: 24px; border: 0 solid var(--y, #ffd21f); pointer-events: none; transition: border-color .25s; }
.vsp-brk.vsp-c-tl { left: -8px; top: -8px; border-left-width: 3px; border-top-width: 3px; }
.vsp-brk.vsp-c-tr { right: -8px; top: -8px; border-right-width: 3px; border-top-width: 3px; }
.vsp-brk.vsp-c-bl { left: -8px; bottom: -8px; border-left-width: 3px; border-bottom-width: 3px; }
.vsp-brk.vsp-c-br { right: -8px; bottom: -8px; border-right-width: 3px; border-bottom-width: 3px; }
.vsp-tag {
  position: absolute; z-index: 1; padding: 1px 5px 1px 4px; pointer-events: none;
  font-size: 9px; line-height: 12px; letter-spacing: .16em;
  background: rgba(5, 5, 4, .82); color: var(--y3, #7a6410);
}
.vsp-tag-l { left: 13px; top: 13px; color: var(--y, #ffd21f); }
.vsp-tag-l::before {
  content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 5px 1px 0; vertical-align: middle;
  border-radius: 50%; background: var(--y, #ffd21f); animation: vsp-caret 1.6s steps(1) infinite;
}
.vsp-crit .vsp-tag-l { color: var(--red, #ff4433); }
.vsp-crit .vsp-tag-l::before { background: var(--red, #ff4433); }
.vsp-tag-r { right: 13px; bottom: 13px; }
.vsp-mname { display: flex; align-items: center; gap: 9px; height: 22px; }
.vsp-mname .vsp-dot { width: 8px; height: 8px; }
.vsp-mname .vsp-name { font-size: 18px; letter-spacing: .34em; margin-right: -.1em; }
.vsp-blocks { display: flex; gap: 3px; }
.vsp-blocks i { display: block; width: 6px; height: 11px; background: var(--y3, #7a6410); }
.vsp-talk .vsp-blocks i { background: var(--y, #ffd21f); animation: vsp-chase .9s steps(1) infinite; }
.vsp-talk .vsp-blocks i:nth-child(2) { animation-delay: -.75s; }
.vsp-talk .vsp-blocks i:nth-child(3) { animation-delay: -.6s; }
.vsp-talk .vsp-blocks i:nth-child(4) { animation-delay: -.45s; }
.vsp-talk .vsp-blocks i:nth-child(5) { animation-delay: -.3s; }
.vsp-talk .vsp-blocks i:nth-child(6) { animation-delay: -.15s; }
.vsp-mline {
  width: 100%; max-width: 460px; min-height: 42px;
  font-size: 15px; line-height: 21px; color: var(--text, #ece6cf);
  overflow-wrap: break-word; transition: color .4s;
}
.vsp-menu .vsp-hint { width: 100%; max-width: 460px; height: auto; min-height: 12px; margin-top: -4px; }
.vsp-sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

@media (max-width: 440px) {
  .vsp-frame { width: 206px; height: 206px; }
  .vsp-frame .vsp-cv { width: 192px; height: 192px; }
  .vsp-mline { font-size: 14px; line-height: 20px; }
}

/* ---------------------------------------------------------------- keyframes */
@keyframes vsp-caret { 0% { opacity: .85; } 50% { opacity: 0; } }
@keyframes vsp-pulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 0 0 rgba(255, 210, 31, .5); } 50% { box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 0 4px rgba(255, 210, 31, 0); } }
@keyframes vsp-eq { 0% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
@keyframes vsp-chase { 0% { opacity: 1; } 33% { opacity: .35; } 66% { opacity: .7; } }
@keyframes vsp-flicker { 0% { opacity: 1; } 31% { opacity: .9; } 32% { opacity: 1; } 67% { opacity: .94; } 68% { opacity: 1; } 89% { opacity: .86; } 90% { opacity: 1; } }
@keyframes vsp-marq { 0%, 16% { transform: translateX(0); } 84%, 100% { transform: translateX(var(--vsp-mdx, 0)); } }
@keyframes vsp-roll { 0% { transform: translateY(-110%); } 100% { transform: translateY(290%); } }
@keyframes vsp-redflash { 0% { opacity: .55; } 14% { opacity: 0; } 28% { opacity: .4; } 42% { opacity: .1; } 57% { opacity: .3; } 85% { opacity: 0; } }
@keyframes vsp-jitter { 0% { transform: translate(2px, 0); } 14% { transform: translate(-3px, 1px); } 28% { transform: translate(1px, -1px); } 42% { transform: translate(-1px, 0); } 57% { transform: translate(2px, 1px); } 71% { transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .vsp-scan, .vsp-scan::after, .vsp-glitch .vsp-cv, .vsp-glitch .vsp-tint, .vsp-talk .vsp-dot { animation: none; }
  .vsp-talk .vsp-bars i, .vsp-talk .vsp-blocks i { animation-duration: 1.6s; }
  .vsp-hint.vsp-marq > span { animation-duration: 12s; }
}

</style>

/* ==== src/js/00_core.js ==== */
/* MIDNIGHT PROTOCOL — core: namespace, event bus, settings, audio context plumbing */
(function () {
  'use strict';
  const MP = (window.MP = window.MP || {});

  // ---------- event bus ----------
  const handlers = new Map();
  MP.bus = {
    on(evt, fn) {
      if (!handlers.has(evt)) handlers.set(evt, new Set());
      handlers.get(evt).add(fn);
      return fn;
    },
    off(evt, fn) {
      const s = handlers.get(evt);
      if (s) s.delete(fn);
    },
    emit(evt, data) {
      const s = handlers.get(evt);
      if (!s) return;
      for (const fn of Array.from(s)) {
        try { fn(data); } catch (e) { console.error('[bus]', evt, e); }
      }
    },
  };

  // ---------- persisted settings (safe localStorage) ----------
  const SKEY = 'mp.settings.v1';
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; } catch (e) { cache = {}; }
  let saveTimer = 0;
  function flush() {
    try { localStorage.setItem(SKEY, JSON.stringify(cache)); } catch (e) { /* storage blocked */ }
  }
  MP.settings = {
    get(key, def) { return Object.prototype.hasOwnProperty.call(cache, key) ? cache[key] : def; },
    set(key, val) {
      cache[key] = val;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 150);
    },
    flush,
  };

  // ---------- fullscreen ----------
  MP.isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  MP.enterFullscreen = function () {
    if (MP.isFullscreen()) return;
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn) return;
    try { const r = fn.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); } catch (e) { /* needs a user gesture */ }
  };
  MP.toggleFullscreen = function () {
    if (MP.isFullscreen()) { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) { try { const r = fn.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) { /* */ } } }
    else MP.enterFullscreen();
  };

  // ---------- audio graph ----------
  let ctx = null, master = null, sfxBus = null, voiceBus = null, musicBus = null, ambBus = null;
  function vol(key, def) { return MP.settings.get(key, def); }
  function applyVolumes() {
    if (!ctx) return;
    const muted = !!vol('muted', false);
    master.gain.value = muted ? 0 : vol('vol.master', 0.8);
    sfxBus.gain.value = vol('vol.sfx', 0.8);
    voiceBus.gain.value = vol('vol.voice', 0.9);
    musicBus.gain.value = vol('vol.music', 0.5);
    ambBus.gain.value = vol('vol.amb', 0.5);
  }
  MP.audio = {
    unlock() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ctx = new AC(); } catch (e) { return null; }
        master = ctx.createGain();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4;
        comp.attack.value = 0.004; comp.release.value = 0.2;
        master.connect(comp); comp.connect(ctx.destination);
        sfxBus = ctx.createGain(); sfxBus.connect(master);
        voiceBus = ctx.createGain(); voiceBus.connect(master);
        musicBus = ctx.createGain(); musicBus.connect(master);
        ambBus = ctx.createGain(); ambBus.connect(master);
        applyVolumes();
        MP.bus.emit('audio:ready', ctx);
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    },
    getCtx() { return ctx; },
    sfxOut() { return sfxBus; },
    voiceOut() { return voiceBus; },
    musicOut() { return musicBus; },
    ambOut() { return ambBus; },
    isMuted() { return !!vol('muted', false); },
    applyVolumes,
  };
})();

    const md2 = (minDist || 18) * (minDist || 18);
    for (const n of S.nations) if (n && n.spawned && U.dist2(n.capX, n.capY, x, y) < md2) return false;
    // need some land around
    let c = 0;
    for (let dy = -6; dy <= 6; dy += 3) for (let dx = -6; dx <= 6; dx += 3) { const u = t + dx + dy * w; if (u >= 0 && u < World.N && World.land[u]) c++; }
    return c >= 18;
  };

  War.randomSpawnTile = function (rng, prefer) {
    const N = World.N;
    for (let k = 0; k < 4000; k++) {
      const t = rng.int(N);
      if (!War.validSpawn(t, k < 2500 ? 22 : 12)) continue;
      if (prefer === 'deposit' && k < 1500) {
        const x = t % World.W, y = (t / World.W) | 0;
        if (!World.deposits.some((d) => !d.owner && U.dist2(d.x, d.y, x, y) < 900)) continue;
      }
      if (prefer === 'coast' && k < 1500) {
        const x = t % World.W, y = (t / World.W) | 0;

  };

  // ---------------- attacks ----------------
  function neighbors(t) {
    const w = World.W, x = t % w;

  }
  War.neighbors = neighbors;

  War.bordersWith = function (a, b) { // does nation a touch nation b (or unclaimed when b=0)?
    const S = G.S, owner = S.owner, land = World.land;
    for (const t of S.nations[a].border) {
      for (const u of neighbors(t)) if (u >= 0 && owner[u] === b && (b !== 0 || land[u])) return true;
    }
    return false;
  };

  War.launch = function (from, to, troops, opts) {
    const S = G.S;
    const a = S.nations[from];
    if (!a || !a.alive || troops < 1) return null;
    if (to && !G.canAttack(from, to)) return null;
    troops = Math.min(troops, a.troops);
    if (troops < 50) return null;
    // merge with an existing attack on the same target
    let at = S.attacks.find((x) => !x.done && x.from === from && x.to === to && !x.boat);
    // opposing attack cancels troops first
    const opp = to ? S.attacks.find((x) => !x.done && x.from === to && x.to === from && !x.boat) : null;
    a.troops -= troops;
    if (opp) {
      const m = Math.min(opp.troops, troops);
      opp.troops -= m; troops -= m;
      if (opp.troops < 1) opp.done = true;

    const fx = opts && opts.fx != null ? opts.fx : null, fy = opts && opts.fy != null ? opts.fy : null;
    if (at && !(opts && opts.seed != null)) {
      at.troops += troops; at.initial += troops;
      if (fx != null) {
        // re-clicking near the same mark concentrates harder; a new mark shifts the weight of the assault
        const near = at.fx != null && U.dist2(at.fx, at.fy, fx, fy) < 900;
        at.fx = fx; at.fy = fy; at.press = Math.min(1, (near ? at.press : at.press * 0.5) + 0.3);
      }

    }
    at = { id: S.nextAttackId++, from, to, troops, initial: troops, front: [], inFront: new Set(), budget: 0, done: false,
      boat: !!(opts && opts.boat), started: S.t, captured: 0, idle: 0, def: 0, defPeak: 0, defNext: S.t + 1.5 + S.rng() * 2.5,
      fx, fy, press: fx != null ? 0.5 : 0 };
    S.attacks.push(at);
    if (opts && opts.seed != null) War.seedFrom(at, opts.seed); else War.refreshFrontier(at);

    const d = to ? S.nations[to] : null;
    if (d && d.isPlayer) {
      MP.Game.notify('attack.incoming', { nation: a.name, troops: U.fmtK(troops) });
      MP.SFX.play('invaded');
      MP.Game.wire('IMINT', `${a.name} PROBES YOUR BORDER`, 'imint');
    }
    return at;
  };

  War.declareWar = function (from, to) {
    const S = G.S, a = S.nations[from], d = S.nations[to];
    if (!a || !d) return;
    const fresh = !a.wars.has(to);
    a.wars.add(to); d.wars.add(from);
    G.addRel(to, from, -12);
    if (fresh) {
      // defender embargoes the aggressor "for the attack"
      if (!d.embargo.has(from) && !d.isPlayer) {
        d.embargo.add(from);
        if (a.isPlayer) { MP.Game.wire('CABLE', `${d.name} EMBARGOES YOU · FOR THE ATTACK`, 'embargo'); MP.Game.notify('diplo.embargo_us', { nation: d.name }); }
      }
      // allies of the defender cool on the attacker
      for (const al of d.allies) G.addRel(al, from, -10);
      for (const al of d.allies) { const n = S.nations[al]; if (n && n.isPlayer) MP.Game.notify('diplo.ally_attacked', { nation: d.name }); }

    }
  };

  War.seedFrom = function (at, t) {
    const S = G.S;
    // capture the landing tile directly
    const own = S.owner[t];
    if (own === at.from) { War.refreshFrontier(at); return; }
    if (own !== at.to) at.to = own;
    G.setOwner(t, at.from, C.DUG_IN_SECONDS);
    for (const u of neighbors(t)) War.pushFront(at, u);
    War.refreshFrontier(at, true);
  };

  War.pushFront = function (at, u) {
    if (u < 0) return;
    const S = G.S;
    if (S.owner[u] !== at.to || !World.land[u] || at.inFront.has(u)) return;
    at.inFront.add(u); at.front.push(u);
  };

  War.refreshFrontier = function (at, keep) {
    const S = G.S, a = S.nations[at.from];

  // number of fort layers protecting (x,y) for defender defId against attacker atkId (0 = none)
  function fortFactor(defId, x, y, atkId) {

    let n = 0;

      if (!G.isActive(f)) continue;

  War.fortFactor = fortFactor;

  War.supplyDist = function (n, x, y) {
    let best = n.capital >= 0 ? U.dist2(n.capX, n.capY, x, y) : 1e12;
    for (const c of n.st.city) { if (c.build > 0) continue; const d = U.dist2(c.x, c.y, x, y); if (d < best) best = d; }
    for (const h of n.st.hub) { if (!G.isActive(h)) continue; const d = U.dist2(h.x, h.y, x, y); if (d < best) best = d; }

  };

  War.tileCost = function (at, t) {
    const S = G.S, a = S.nations[at.from], v = World.terr[t];
    const w = World.W, x = t % w, y = (t / w) | 0;

    let slow = 1 / C.ELEV_SPEED[v >> 2];

      const d = S.nations[at.to];

      cost *= G.mod(d, 'defendCost');

  War.tick = function (dt) {
    const S = G.S, owner = S.owner;

  War.finish = function (at, returnTroops) {
    if (at.done) return;

    at.done = true;
    if (returnTroops && a && a.alive && at.troops > 0) a.troops += at.troops;

    if (d && d.isPlayer && d.alive && at.captured < 40 && S.t - at.started > 3) MP.Game.notify('attack.repelled', { nation: a.name });

  };

  // defender commits troops to hold a front (shown as the defender's number on the map)
  War.commitDefense = function (at, amount) {
    const S = G.S, d = S.nations[at.to];
    if (!d || !d.alive || at.done) return 0;
    amount = Math.min(amount, d.troops);
    if (amount < 50) return 0;
    d.troops -= amount; at.def += amount; at.defPeak = Math.max(at.defPeak, at.def);
    return amount;
  };
  War.aiDefend = function (at) {
    const S = G.S, d = S.nations[at.to];
    at.defNext = S.t + 6 + S.rng() * 4;
    if (!d || !d.ai || !d.alive) return;
    const pers = C.PERSONALITIES[d.personality] || C.PERSONALITIES.opportunist;
    if (at.troops < d.troops * 0.06 && at.troops < 3000) return;           // a probe: not worth committing
    if (at.def > at.troops * 0.5) return;                                    // the line already holds

  War.recall = function (at) {
    if (at.done) return;

  };

  // ---------------- pockets / supply connectivity (one nation per call) ----------------
  War.pocketCursor = 1;
  War.tickPockets = function () {
    const S = G.S;

    const nn = S.nations.length;
    for (let tries = 0; tries < nn; tries++) {
      War.pocketCursor = War.pocketCursor % (nn - 1) + 1;
      const n = S.nations[War.pocketCursor];
      if (n && n.alive && n.spawned && n.tiles > 0) { War.analyzePockets(n); return; }
    }
  };

  const visit = { arr: null, gen: 0 };
  War.analyzePockets = function (n) {
    const S = G.S, owner = S.owner, w = World.W, N = World.N;
    if (!visit.arr) visit.arr = new Uint32Array(N);

    // annex enclosed pockets
    for (const c of comps) {
      if (c.hasCap || c.open || c.size > n.tiles * 0.3) continue;
      let best = 0, bc = 0;
      for (const [o, cnt] of c.nb) if (cnt > bc && G.canAttack(o, id)) { bc = cnt; best = o; }
      if (!best) continue;
      let cx = 0, cy = 0; for (const t of c.tiles) { cx += t % w; cy += (t / w) | 0; } cx /= c.size; cy /= c.size;
      S.pockets = S.pockets || [];
      const trapped = n.troops * c.size / Math.max(1, n.tiles);
      let pk = S.pockets.find((q) => q.nation === id && U.dist2(q.x, q.y, cx, cy) < 900);
      const notable = c.size >= 25 || (n.isPlayer && c.size >= 8);
      if (!pk && notable) {
        const byN = S.nations[best];
        const delay = 7 * (G.has(byN, 'blitzkrieg') ? 0.75 : 1) * (G.has(byN, 'pincer') ? 0.6 : 1);
        pk = { nation: id, by: best, x: cx, y: cy, troops: trapped, size: c.size, seen: S.t, annexAt: S.t + delay };
        S.pockets.push(pk);
        // Call for the Motherland: encircled troops on home soil dig in like a fort and break out toward the main force
        let homeTiles = 0; for (const t of c.tiles) if (S.home[t] === id) homeTiles++;
        if (G.has(n, 'motherland') && homeTiles > c.size * 0.6) {
          let ownFort = false;
          for (const f of n.st.fort) if (U.dist2(f.x, f.y, cx, cy) < 70 * 70) { ownFort = true; break; }
          S.tempForts = S.tempForts || [];
          S.tempForts.push({ owner: id, x: cx, y: cy, r: Math.max(10, Math.sqrt(c.size) * 1.3) * (ownFort ? 1.4 : 1), until: S.t + 75 });
          pk.breakout = true; pk.annexAt = S.t + 75;

          let seed = -1, bd = 1e18;

          continue;
        }
        if (n.isPlayer) { MP.Game.notify('pocket.cut', {}); MP.Game.wire('IMINT', `${U.fmtInt(trapped)} OF YOUR TROOPS ENCIRCLED BY ${byN.name}`, 'bad'); }
        else if (byN && byN.isPlayer) MP.Game.wire('IMINT', `${U.fmtInt(trapped)} ${n.name} TROOPS ENCIRCLED`, 'good');
        continue;
      }
      if (pk) {
        pk.seen = S.t; pk.troops = trapped; pk.x = cx; pk.y = cy; pk.by = best; pk.size = c.size;
        if (S.t < pk.annexAt) continue;
        if (pk.breakout) { S.pockets.splice(S.pockets.indexOf(pk), 1); continue; } // the breakout window closed; re-evaluate next pass

    }
  };

    let land = -1, bd = 1e9;
    for (let dy = -12; dy <= 12; dy++) for (let dx = -12; dx <= 12; dx++) {
      const u = targetTile + dx + dy * w;
      if (u < 0 || u >= World.N || !World.coast[u] || S.owner[u] === n.id) continue;
      const d = dx * dx + dy * dy; if (d < bd) { bd = d; land = u; }

    const tgtOwner = S.owner[land];
    if (tgtOwner && !G.canAttack(n.id, tgtOwner)) return { ok: false, reason: 'Allied or under truce' };

    for (const p of n.st.port) { if (p.build > 0) continue; const d = U.dist2(p.x, p.y, lx, ly); if (d < dd) { dd = d; dep = [p.x, p.y]; } }
    if (!dep) {
      let k = 0;
      for (const t of n.border) {
        if (!World.coast[t]) continue;
        if ((k++ & 3) !== 0) continue;
        const x = t % w, y = (t / w) | 0, d = U.dist2(x, y, lx, ly);
        if (d < dd) { dd = d; dep = [x, y]; }
      }
    }
    if (!dep) return { ok: false, reason: 'You have no coastline' };
    const path = World.seaPath(dep[0], dep[1], lx, ly);
    if (!path || path.length < 2) return { ok: false, reason: 'No sea route' };
    path.push([lx, ly]);
    troops = Math.min(troops, n.troops);
    if (troops < 100) return { ok: false, reason: 'Not enough troops' };
    n.troops -= troops;
    const sh = { id: shipId++, kind: 'transport', owner: n.id, x: path[0][0], y: path[0][1], path, pi: 1, speed: C.TRANSPORT.speed * 2.2,
      hp: C.TRANSPORT.hp, maxHp: C.TRANSPORT.hp, troops, landing: land, target: tgtOwner, ang: 0, born: S.t };

  // ---------------- warships ----------------
  Naval.spawnWarship = function (n, port, patrol, buildTime) {

            if (tgt && (tgt === sh.owner || G.isAllied(sh.owner, tgt))) hostile = true; // defending our coast
          }
          if (!hostile) continue;

      if (moveAlong(sh, dt)) { sh.path = null; if (sh.fuel >= W.fuel * 0.95) sh.state = 'patrol'; }
      if (!away && sh.fuel >= W.fuel * 0.95) sh.state = 'patrol';
      return;
    }
    if (sh.state === 'chase' && sh.target) {
      const t = sh.target;
      const d = U.dist(sh.x, sh.y, t.x, t.y);
      if (d > W.range * 0.7) {

      if (d <= W.range) {
        if (t.kind === 'trade') { Naval.capture(sh, t); sh.target = null; sh.state = 'patrol'; }
        else {
          t.hp -= W.dps * dt; t.lastHitBy = sh.owner;

      const [px, py] = pickPatrolPoint(sh);
      sh.path = U.dist(sh.x, sh.y, px, py) < 30 ? [[px, py]] : (World.seaPath(sh.x, sh.y, px, py, 60000) || [[px, py]]);

  };

  Naval.capture = function (sh, t) {
    const S = G.S;
    const captor = S.nations[sh.owner], victim = S.nations[t.owner];

  };

  Naval.sunk = function (sh) {
    const S = G.S;
    MP.FX && MP.FX.burst(sh.x, sh.y, [255, 160, 60], sh.kind === 'warship' ? 8 : 5);
    const o = S.nations[sh.owner];
    const by = S.nations[sh.lastHitBy];

/* MIDNIGHT PROTOCOL — strategic weapons: research, silos, missiles, radar warning,

(function () {
  'use strict';

  const Wp = (MP.Weapons = {});

  // ---------------- research ----------------
  Wp.researchCost = function (n, w) {
    const r = C.WEAPON[w].research;
    return { credits: r[0], u: r[1], time: r[2] * G.mod(n, 'research') };
  };
  Wp.canResearch = function (n, w) {
    if (n.research[w]) return { ok: false, reason: 'Already researched' };
    if (n.researching) return { ok: false, reason: 'Already researching ' + n.researching.w };
    if (G.S.defcon > C.WEAPON[w].defcon) return { ok: false, reason: 'Locked until DEFCON ' + C.WEAPON[w].defcon };
    const c = Wp.researchCost(n, w);
    if (n.credits < c.credits) return { ok: false, reason: 'Not enough credits' };
    if (n.uranium < c.u) return { ok: false, reason: 'Not enough uranium' };
    return { ok: true, cost: c };
  };
  Wp.startResearch = function (n, w) {
    const chk = Wp.canResearch(n, w);
    if (!chk.ok) return chk;
    n.credits -= chk.cost.credits; n.uranium -= chk.cost.u;
    n.researching = { w, t: 0, total: chk.cost.time };
    if (n.isPlayer) { MP.Game.notify('research.started', { weapon: w }); MP.SFX.play('research'); }
    return chk;

  Wp.tickResearch = function (dt) {
    for (const n of G.S.nations) {
      if (!n || !n.alive || !n.researching) continue;
      n.researching.t += dt;
      if (n.researching.t >= n.researching.total) {
        const w = n.researching.w;

  Wp.launchers = function (n, w, x, y) {

    if (n.launchBanUntil > S.t) return { ok: false, reason: 'Council arms embargo in force' };

      st.owner = p.id; p.st[st.type].push(st); p.levels[st.type] = (p.levels[st.type] || 0) + st.level;
    }
    for (let t = 0; t < World.N; t++) if (S.owner[t] === n.id) G.setOwner(t, p.id, 0);
    for (const sh of S.ships) if (sh.owner === n.id) sh.owner = p.id;
    for (const at of S.attacks) if (at.from === n.id) { at.from = p.id; War_refresh(at); }
    p.troops += n.troops; p.credits += n.credits; p.uranium += n.uranium;
    for (const w in n.research) p.research[w] = true;
    n.troops = 0; n.credits = 0; n.uranium = 0;
    n.alive = false; n.eliminatedAt = S.t;
    for (const o of S.nations) if (o) { o.allies.delete(n.id); o.truces.delete(n.id); o.wars.delete(n.id); o.embargo.delete(n.id); }
    S.roadsDirty = true;
    MP.Game.wire('FLASH', `${n.name} IS CEDED TO YOU — LAND, FORCES AND TREASURY TRANSFERRED`, 'good');
    MP.Game.notify('diplo.ceded', { nation: n.name, text: `${n.name} has signed. Its flag comes down without a shot.`, priority: 2 });
    MP.SFX.play('milestone');
  }
  function War_refresh(at) { MP.War.refreshFrontier(at); }
  function independence(p, n) {
    const S = G.S;
    n.puppet = false; n.partner = false; n.team = 0; S.puppetId = 0;
    p.allies.delete(n.id); n.allies.delete(p.id);
    G.S.relations[n.id * S.relN + p.id] = -100;
    n.personality = 'hawk';
    n.ai.grudge.set(p.id, 12);
    MP.War.declareWar(n.id, p.id);
    MP.Game.wire('FLASH', `${n.name} DECLARES INDEPENDENCE AND GOES TO WAR WITH YOU`, 'betray');
    MP.Game.notify('diplo.betrayed', { nation: n.name });
    MP.SFX.play('betrayal');
    // it courts your enemies first, then its nearest neighbours
    const cands = G.alive().filter((o) => o.id !== n.id && o.id !== p.id && !G.isAllied(o.id, p.id) && o.ai)
      .sort((a, b) => (b.wars.has(p.id) - a.wars.has(p.id)) || (U.dist2(a.capX, a.capY, n.capX, n.capY) - U.dist2(b.capX, b.capY, n.capX, n.capY)));
    let signed = 0;
    for (const o of cands.slice(0, 5)) {
      if (signed >= 3) break;
      if (S.rng() < (o.wars.has(p.id) ? 0.85 : 0.6)) { D.formAlliance(n, o); MP.War.declareWar(o.id, p.id); signed++; MP.Game.wire('CABLE', `${o.name} JOINS ${n.name} AGAINST YOU`, 'bad'); }
    }
    if (MP.War.bordersWith(n.id, p.id)) MP.War.launch(n.id, p.id, n.troops * 0.5, { fx: p.capX, fy: p.capY });
  }
  function answerCede(r, p, n) {
    if (!n.puppet || !n.alive) return;
    if (G.S.rng() < D.cedeOdds(p, n)) annexPuppet(p, n); else independence(p, n);
  }
  // runs once a second: keeps the puppet behind you and feeds your war effort
  D.tickPuppet = function () {
    const S = G.S, p = G.player();
    const n = D.puppetOf(p);
    if (!n || !p || !p.alive) return;
    // never stronger or richer than its master (gifts you made it are kept out of this)
    if (n.troops > p.troops) {
      const give = Math.min(n.troops - (n.giftedT || 0), (n.troops - p.troops) / 2 + n.troops * 0.03);
      if (give > 50) { n.troops -= give; p.troops += give; }
    }
    if (n.credits > p.credits) {
      const give = Math.min(n.credits - (n.giftedC || 0), (n.credits - p.credits) / 2 + n.credits * 0.03);
      if (give > 50) { n.credits -= give; p.credits += give; }
    }
    // follow the master into every war
    const targets = new Set();
    for (const at of S.attacks) if (at.from === p.id && at.to && !at.done) targets.add(at.to);
    if (p.targetId) targets.add(p.targetId);
    let focus = 0;
    for (const t of targets) { if (MP.War.bordersWith(n.id, t)) { focus = t; break; } if (!focus) focus = t; }
    if (focus) {
      n.ai.focus = focus; n.ai.focusUntil = S.t + 20; n.wars.add(focus);
      const reachable = MP.War.bordersWith(n.id, focus);
      // can't reach it on land: send troops home for the war effort
      if (!reachable && S.t - (n.ai.lastDonate || 0) > 8 && n.troops > n.cap * 0.25) {
        n.ai.lastDonate = S.t;
        const amt = n.troops * 0.12; n.troops -= amt; p.troops += amt;
        MP.Game.wire('CABLE', `${n.name} SENDS ${U.fmtK(amt)} TROOPS FOR THE WAR EFFORT`, 'good');
      }
    }
  };

  // ---------------- player requests (async bot answers) ----------------
  D.pending = [];
  D.requestAlliance = function (p, b) {
    const S = G.S;
    if (S.opts.party && S.opts.party.length) { MP.Game.notify('diplo.party_no_alliance', {}); MP.Game.toast('Your party forfeits alliances', 'bad'); return; }
    if (S.opts.mode === 'teams') { MP.Game.toast('Teams are fixed in this mode', 'bad'); return; }
    if (D.allianceCount(p) >= C.ALLIANCE_MAX) { MP.Game.notify('diplo.alliance_cap', {}); MP.Game.toast('Alliance limit reached (' + C.ALLIANCE_MAX + ')', 'bad'); return; }
    if (D.pending.some((x) => x.to === b.id && x.kind === 'ally')) return;
    D.pending.push({ kind: 'ally', from: p.id, to: b.id, at: S.t + 1 + S.rng() * 3 });
    MP.Game.toast(`Alliance proposed to ${b.name}`, 'info');
    MP.SFX.play('send');
  };
  D.requestTruce = function (p, b) {
    const S = G.S;
    if (D.pending.some((x) => x.to === b.id && x.kind === 'truce')) return;
    D.pending.push({ kind: 'truce', from: p.id, to: b.id, at: S.t + 1 + S.rng() * 3 });
    MP.Game.toast(`Truce proposed to ${b.name}`, 'info');
    MP.SFX.play('send');
  };

  D.tickPending = function () {
    const S = G.S;
    for (let i = D.pending.length - 1; i >= 0; i--) {
      const r = D.pending[i];
      if (r.at > S.t) continue;
      D.pending.splice(i, 1);
      const a = S.nations[r.from], b = S.nations[r.to];
      if (!a || !b || !a.alive || !b.alive) continue;
      if (r.kind === 'ally') {
        const p = D.allianceOdds(a, b);
        if (D.allianceCount(b) < C.ALLIANCE_MAX && S.rng() < p) { D.formAlliance(a, b); MP.Game.notify('diplo.accepted', { nation: b.name }); MP.Game.wire('CABLE', `${b.name} SIGNS AN ALLIANCE WITH YOU`, 'good'); }
        else { MP.Game.notify('diplo.declined', { nation: b.name }); MP.Game.wire('CABLE', `${b.name} DECLINES YOUR ALLIANCE`, 'cable'); G.addRel(b.id, a.id, -2); MP.SFX.play('decline'); }
      } else if (r.kind === 'aid') {
        answerAid(r, a, b);
      } else if (r.kind === 'cede') {
        answerCede(r, a, b);
      } else if (r.kind === 'truce') {
        const p = D.truceOdds(a, b);
        if (S.rng() < p) { D.formTruce(a, b); MP.Game.notify('diplo.truce', { nation: b.name }); MP.Game.wire('CABLE', `${b.name} AGREES TO A 3:00 TRUCE`, 'good'); MP.SFX.play('alliance'); }
        else { MP.Game.notify('diplo.truce_declined', { nation: b.name }); MP.Game.wire('CABLE', `${b.name} REJECTS A TRUCE`, 'cable'); MP.SFX.play('decline'); }
      }
    }
    // truce expiry notices for the player
    const p = G.player();
    if (p) for (const [id, until] of p.truces) {
      if (until <= S.t) { p.truces.delete(id); const o = S.nations[id]; if (o) { o.truces.delete(p.id); MP.Game.notify('diplo.truce_over', { nation: o.name }); } }
    }
    // offers to the player expire
    for (let i = S.offers.length - 1; i >= 0; i--) if (S.offers[i].until <= S.t) { S.offers.splice(i, 1); MP.HUD && MP.HUD.renderOffers(); }
  };

  // bot → player offer
  D.offerToPlayer = function (b, kind) {
    const S = G.S, p = G.player();
    if (!p || !p.alive) return;
    if (S.offers.some((o) => o.from === b.id && o.kind === kind)) return;
    if (kind === 'ally' && (D.allianceCount(p) >= C.ALLIANCE_MAX || (S.opts.party && S.opts.party.length) || S.opts.mode === 'teams')) return;
    S.offers.push({ kind, from: b.id, until: S.t + C.OFFER_SECONDS, total: C.OFFER_SECONDS });
    MP.Game.notify(kind === 'ally' ? 'diplo.offer' : 'diplo.truce_offer', { nation: b.name });
    MP.Game.wire('CABLE', `${b.name} OFFERS YOU ${kind === 'ally' ? 'AN ALLIANCE' : 'A TRUCE'}`, 'cable');
    MP.SFX.play('offer');
    MP.HUD && MP.HUD.renderOffers();
  };
  D.answerOffer = function (offer, yes) {
    const S = G.S, p = G.player(), b = S.nations[offer.from];
    const i = S.offers.indexOf(offer); if (i >= 0) S.offers.splice(i, 1);
    if (!b || !b.alive || !p) return;
    if (yes) {
      if (offer.kind === 'ally') {
        if (D.allianceCount(p) >= C.ALLIANCE_MAX) { MP.Game.toast('Alliance limit reached', 'bad'); return; }
        D.formAlliance(p, b); MP.Game.notify('diplo.accepted', { nation: b.name });
      } else { D.formTruce(p, b); MP.Game.notify('diplo.truce', { nation: b.name }); MP.SFX.play('alliance'); }
    } else { G.addRel(b.id, p.id, -6); MP.SFX.play('decline'); }
    MP.HUD && MP.HUD.renderOffers();
  };

  // ---------------- allied target (player marks an enemy for allies / party to focus) ----------------
  D.setTarget = function (p, n) {
    const S = G.S;
    if (p.targetId === n.id) {
      p.targetId = 0;
      for (const o of S.nations) if (o && o.ai && o.ai.focus === n.id) o.ai.focus = 0;
      MP.Game.wire('CABLE', `TARGET ON ${n.name} RESCINDED`, 'cable');
      MP.Game.toast('Allied target cleared', 'info');
      return;
    }
    const friends = G.alive().filter((o) => o.ai && o.id !== p.id && G.isAllied(o.id, p.id));
    if (!friends.length) { MP.Game.toast('You have no allies or party to direct', 'bad'); MP.SFX.play('error'); return; }
    p.targetId = n.id;
    let yes = 0;
    for (const o of friends) {
      if (G.isAllied(o.id, n.id)) continue;
      const odds = o.partner || (o.team && o.team === p.team) ? 0.97 : U.clamp(0.4 + G.rel(o.id, p.id) / 120 - G.rel(o.id, n.id) / 200, 0.1, 0.95);
      if (S.rng() < odds) { o.ai.focus = n.id; o.ai.focusUntil = S.t + 240; yes++; G.addRel(o.id, n.id, -10); }
    }
    MP.Game.wire('CABLE', yes ? `${yes} ${yes === 1 ? 'ALLY COMMITS' : 'ALLIES COMMIT'} TO THE STRIKE ON ${n.name}` : `YOUR ALLIES WILL NOT MOVE ON ${n.name}`, yes ? 'good' : 'cable');
    MP.Game.notify('diplo.target', { nation: n.name, text: yes ? `${n.name} is marked. ${yes} ${yes === 1 ? 'ally is' : 'allies are'} moving.` : `Nobody wants ${n.name} badly enough.`, priority: 1 });
    MP.SFX.play(yes ? 'alliance' : 'decline');
  };

  D.requestAid = function (p, ally, kind) {
    const S = G.S;
    p.aidCd = p.aidCd || {};
    const key = ally.id + kind;
    if ((p.aidCd[key] || 0) > S.t) { MP.Game.toast(`${ally.name} was asked recently — wait ${Math.ceil(p.aidCd[key] - S.t)}s`, 'bad'); return; }
    p.aidCd[key] = S.t + 45;
    D.pending.push({ kind: 'aid', what: kind, from: p.id, to: ally.id, at: S.t + 1 + S.rng() * 2.5 });
    MP.Game.toast(`Requested ${kind} from ${ally.name}`, 'info');
    MP.SFX.play('send');
  };
  function answerAid(r, a, b) {
    const S = G.S;
    if (!G.isAllied(a.id, b.id)) return;
    const partner = b.partner || (b.team && b.team === a.team);
    let odds = partner ? 0.8 : U.clamp(0.25 + G.rel(b.id, a.id) / 140, 0.05, 0.85);
    if (G.has(a, 'diplomacy')) odds += 0.12;
    if (b.puppet) odds = 9; // a puppet answers 99%: the roll below is overridden
    const underFire = S.t - b.lastHitAt < 10;
    if (r.what === 'troops') { odds += b.troops / Math.max(1, b.cap) > 0.55 ? 0.2 : -0.25; if (underFire) odds -= 0.35; }
    else odds += b.credits > 25000 ? 0.15 : -0.3;
    if (a.lastHitAt && S.t - a.lastHitAt < 15) odds += 0.15; // helping a friend under attack
    if (b.puppet ? S.rng() < 0.99 : S.rng() < odds) {
      const amt = r.what === 'troops' ? b.troops * (0.1 + S.rng() * 0.12) : b.credits * (0.12 + S.rng() * 0.15);
      const got = D.gift(b, a, r.what, amt);
      MP.Game.wire('CABLE', `${b.name} SENDS YOU ${U.fmtK(got)} ${r.what.toUpperCase()}`, 'good');
      MP.Game.notify('diplo.gift', { nation: b.name });
      MP.SFX.play(r.what === 'troops' ? 'alliance' : 'coin');
    } else {
      MP.Game.wire('CABLE', `${b.name} DECLINES YOUR REQUEST FOR ${r.what.toUpperCase()}`, 'cable');
      MP.SFX.play('decline');
    }
  }

  // ---------------- betrayal check (AI side) ----------------
  D.tickBetrayal = function () {
    const S = G.S;
    const L = leaderInfo();
    for (const a of S.nations) {
      if (!a || !a.alive || !a.ai || a.partner) continue;
      for (const bid of Array.from(a.allies)) {
        const b = S.nations[bid];
        if (!b || !b.alive) { a.allies.delete(bid); continue; }
        if (a.team && a.team === b.team) continue;
        const key = a.id + ':' + bid;
        S._betrayT = S._betrayT || {};
        if ((S._betrayT[key] || 0) > S.t) continue;
        S._betrayT[key] = S.t + 60 + S.rng() * 30;
        const pers = C.PERSONALITIES[a.personality];
        // temptation: a weak neighbouring ally, or an ally running away with the world
        const neighbor = MP.War.bordersWith(a.id, bid);
        const ratio = strength(a) / Math.max(1, strength(b));
        const runaway = L.first && L.first.id === bid && L.second && b.tiles > L.second.tiles * 1.6;
        let tempted = (neighbor && ratio > 1.6 && a.troops > a.cap * 0.55) || (runaway && S.t > 600);
        if (G.rel(a.id, bid) > 60) tempted = false;
        if (!tempted) continue;
        if (S.rng() < C.BETRAY_CHANCE * Math.min(1.2, pers.betray * 0.8)) {
          D.breakAlliance(a, b, true);
          if (neighbor) MP.War.launch(a.id, bid, a.troops * 0.4);
        }
      }
    }
  };

  // ---------------- wire aggregation ----------------
  D._agg = {};
  D.agg = function (label) { D._agg[label] = (D._agg[label] || 0) + 1; };
  D.flushAgg = function () {
    for (const k in D._agg) {
      const c = D._agg[k];
      MP.Game.wire('CABLE', c > 1 ? `${k} ×${c}` : k.replace(/S\b/, ''), 'cable');
    }
    D._agg = {};
  };

  // =============== GLOBAL COUNCIL ===============
  D.tickCouncil = function (dt) {
    const S = G.S, cn = S.council;
    if (!S.opts.council) return;
    for (let i = cn.effects.length - 1; i >= 0; i--) if (cn.effects[i].until <= S.t) {
      const e = cn.effects.splice(i, 1)[0];
      MP.Game.wire('COUNCIL', `${e.name.toUpperCase()} HAS LAPSED`, 'council');
      S.roadsDirty = true;
    }
    if (cn.active) {
      if (S.t >= cn.active.closes) D.closeSession();
      return;
    }
    if (S.phase !== 'play') return;
    cn.next -= dt;
    if (cn.next > 0) return;
    cn.next = C.COUNCIL_INTERVAL;
    D.openSession();
  };

  D.openSession = function () {
    const S = G.S, cn = S.council;
    const L = leaderInfo();
    const opts = C.RESOLUTIONS.filter((r) => {
      if (r.id === 'accord') return S.t > 25 * 60 && S.clock < 240;
      if (r.id === 'armsembargo') return G.alive().some((n) => n.launches > 0);
      if (r.id === 'testban') return S.defcon <= 4;
      return true;
    });
    const r = opts[S.rng.int(opts.length)];
    const res = { id: r.id, name: r.name, desc: r.desc, closes: S.t + C.COUNCIL_VOTE_SECONDS, total: C.COUNCIL_VOTE_SECONDS, votes: {}, target: 0 };
    if (r.id === 'sanctions' || r.id === 'accord') res.target = L.first ? L.first.id : 0;
    if (r.id === 'armsembargo') { let best = null; for (const n of G.alive()) if (!best || n.launches > best.launches) best = n; res.target = best ? best.id : 0; }
    if (res.target) res.targetName = S.nations[res.target].name;
    cn.active = res;
    MP.Game.wire('COUNCIL', `SESSION OPENS · ${r.name.toUpperCase()}${res.targetName ? ' · ' + res.targetName : ''}`, 'council');
    MP.Game.notify('council.session', { resolution: r.name });
    MP.Game.tut('tut.council');
    MP.SFX.play('council');
    // bots vote immediately (hidden until close)
    for (const n of G.alive()) if (n.ai) res.votes[n.id] = D.botVote(n, res, L);
    MP.HUD && MP.HUD.openCouncil(res);
  };

  D.botVote = function (n, res, L) {
    const S = G.S;
    const pers = C.PERSONALITIES[n.personality];
    let s = (S.rng() - 0.5) * 0.6;
    const rank = L.list.indexOf(n);
    switch (res.id) {
      case 'sanctions':
        if (n.id === res.target) return 'no';
        if (G.isAllied(n.id, res.target)) return 'no';
        s += 0.3 - G.rel(n.id, res.target) / 100; break;
      case 'testban': s += (n.research.ICBM || n.research.Hypersonic ? -0.4 : 0.35) - (pers.nuke - 0.6); break;
      case 'armsembargo':
        if (n.id === res.target || G.isAllied(n.id, res.target)) return 'no';
        s += 0.35 - G.rel(n.id, res.target) / 150; break;
      case 'ceasefire': s += (n.wars.size > 1 ? 0.3 : -0.1) + (rank > 5 ? 0.25 : -0.3) - (pers.aggro - 0.5); break;
      case 'quota': s += n.st.enrich.length ? -0.5 : 0.4; break;
      case 'relief': s += rank < 3 ? -0.8 : rank > L.list.length - 6 ? 0.6 : 0.1; break;
      case 'accord':
        if (n.id === res.target || G.isAllied(n.id, res.target)) return 'yes';
        s += (n.tiles < L.list[0].tiles * 0.25 ? 0.25 : -0.4) + (S.clock < 120 ? 0.3 : 0); break;
    }
    return s > 0.1 ? 'yes' : s < -0.1 ? 'no' : 'abstain';
  };

  D.playerVote = function (v) {
    const S = G.S, p = G.player();
    if (!S.council.active || !p) return;
    S.council.active.votes[p.id] = v;
    MP.SFX.play('click');
  };

  D.closeSession = function () {
    const S = G.S, cn = S.council, res = cn.active;
    cn.active = null;
    let yes = 0, no = 0;
    for (const id in res.votes) { const w = G.mod(S.nations[id], 'councilVotes'); if (res.votes[id] === 'yes') yes += w; else if (res.votes[id] === 'no') no += w; }
    res.yes = yes; res.no = no;
    const passed = yes > no;
    MP.HUD && MP.HUD.closeCouncil(res, passed);
    MP.Game.wire('COUNCIL', `${res.name.toUpperCase()} ${passed ? 'PASSES' : 'FAILS'} ${yes}–${no}`, 'council');
    MP.Game.notify(passed ? 'council.passed' : 'council.failed', { resolution: res.name });
    MP.SFX.play(passed ? 'councilPass' : 'councilFail');
    if (!passed) return;
    const until = S.t + C.COUNCIL_EFFECT;
    switch (res.id) {
      case 'sanctions': cn.effects.push({ id: 'sanctions', name: res.name, target: res.target, until }); S.roadsDirty = true; break;
      case 'testban': cn.effects.push({ id: 'testban', name: res.name, until }); S.clock = Math.min(C.CLOCK_START, S.clock - C.CLOCK.councilBan); break;
      case 'armsembargo': { const t = S.nations[res.target]; if (t) t.launchBanUntil = S.t + 90; cn.effects.push({ id: 'armsembargo', name: res.name, target: res.target, until: S.t + 90 }); break; }
      case 'ceasefire': {
        const al = G.alive();
        for (const a of al) for (const b of al) if (a.id < b.id && !G.isAllied(a.id, b.id)) {
          a.truces.set(b.id, S.t + 60); b.truces.set(a.id, S.t + 60);
        }
        for (const at of S.attacks) if (at.to) MP.War.finish(at, true);
        S.clock = Math.min(C.CLOCK_START, S.clock + 30);
        break;
      }
      case 'quota': cn.effects.push({ id: 'quota', name: res.name, until }); break;
      case 'relief': {
        const L = leaderInfo();
        const small = L.list[L.list.length - 1];
        for (const big of L.list.slice(0, 3)) { const amt = big.credits * 0.1; big.credits -= amt; if (small) small.credits += amt; }
        break;
      }
      case 'accord': MP.Game.endMatch('council'); break;
    }
  };

  // council truce check also respects ceasefire via truces map → canAttack
  D.tick = function (dt) {
    const S = G.S;
    D.tickPending();
    S._pupT = (S._pupT || 0) + dt;
    if (S._pupT >= 1) { S._pupT = 0; D.tickPuppet(); }
    S._betT = (S._betT || 0) + dt;

      const lat = World.rowLat[Math.round(y)];

      const x = dir > 0 ? S.rng() * World.W * 0.8 : World.W * 0.2 + S.rng() * World.W * 0.8;

    const S = G.S;

    for (const s of e.st.city) cands.push([s.x, s.y, 2 + s.level * 0.3]);
