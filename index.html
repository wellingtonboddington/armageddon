      softCtx.putImageData(softImg, 0, 0, r[0], r[1], r[2] - r[0] + 1, r[3] - r[1] + 1);
    }
  }
  R.redrawAll = function () {
    const S = G.S; if (!S) return;
    for (let t = 0; t < World.N; t++) if (S.owner[t] || S.softUntil[t]) R.dirty(t);
  };

  // ---------------- camera ----------------
  R.w2s = (x, y) => [(x - cam.x) * cam.z + VW / 2, (y - cam.y) * cam.z + VH / 2];
  R.s2w = (sx, sy) => [(sx - VW / 2) / cam.z + cam.x, (sy - VH / 2) / cam.z + cam.y];
  R.clampCam = function () {
    cam.z = U.clamp(cam.z, R.minZoom(), 42);
    const hw = VW / 2 / cam.z, hh = VH / 2 / cam.z;
    cam.x = World.W < hw * 2 ? World.W / 2 : U.clamp(cam.x, hw - 40, World.W - hw + 40);
    cam.y = World.H < hh * 2 ? World.H / 2 : U.clamp(cam.y, hh - 40, World.H - hh + 40);
  };
  R.zoomAt = function (sx, sy, f) {
    const [wx, wy] = R.s2w(sx, sy);
    cam.z *= f; R.clampCam();
    const [wx2, wy2] = R.s2w(sx, sy);
    cam.x += wx - wx2; cam.y += wy - wy2; R.clampCam();
    cam.tx = null;
  };
  R.pan = function (dx, dy) { cam.x -= dx / cam.z; cam.y -= dy / cam.z; R.clampCam(); cam.tx = null; };
  R.centerOn = function (x, y, z) { cam.tx = x; cam.ty = y; cam.tz = z || Math.max(cam.z, 4); };
  R.focusWorld = function () { cam.x = World.W / 2; cam.y = World.H * 0.47; cam.z = R.minZoom() * 1.02; cam.tx = null; R.clampCam(); };
  R.getCamera = () => ({ x: cam.x, y: cam.y, z: cam.z });
  R.setCamera = (c) => { cam.x = c.x; cam.y = c.y; cam.z = c.z; cam.tx = null; R.clampCam(); };

  // ---------------- FX api ----------------
  const FX = (MP.FX = {});
  FX.burst = (x, y, col, n) => { for (let i = 0; i < (n || 6); i++) effects.push({ k: 'p', x, y, vx: U.R.range(-6, 6), vy: U.R.range(-6, 6), life: 0.8 + U.R() * 0.6, t: 0, col }); };
  FX.floatText = (x, y, text, col, sub) => effects.push({ k: 'txt', x, y, text, sub, col, t: 0, life: 2.6 });
  FX.coin = (x, y) => { if (effects.length < 900) effects.push({ k: 'coin', x, y, t: 0, life: 0.9 }); };
  FX.shot = (x1, y1, x2, y2) => effects.push({ k: 'shot', x1, y1, x2, y2, t: 0, life: 0.25 });
  FX.split = (x, y) => effects.push({ k: 'ring', x, y, r: 6, t: 0, life: 0.8, col: [255, 220, 120] });
  FX.interceptor = (x, y, m, hit) => {
    const [px, py] = MP.Weapons.pos(m);
    effects.push({ k: 'icpt', x1: x, y1: y, x2: px, y2: py, hit, t: 0, life: 0.7 });
    if (hit) effects.push({ k: 'ring', x: px, y: py, r: 5, t: 0, life: 0.6, col: [120, 230, 255] });
  };
  FX.detonation = (x, y, r, w, det) => {
    const dc = (C.DETONATIONS.find((d) => d.id === det) || C.DETONATIONS[0]).rgb;
    effects.push({ k: 'det', x, y, r, w, t: 0, life: w === 'Airstrike' ? 1.2 : 3.6, col: w === 'EMP' ? [120, 200, 255] : dc });
    if (w !== 'Airstrike' && w !== 'EMP') R.shake = Math.min(14, (R.shake || 0) + r * 0.35);
  };
  FX.ping = (x, y, col) => effects.push({ k: 'ping', x, y, t: 0, life: 2.2, col: col || [255, 210, 31] });
  R.ping = FX.ping;

  // ---------------- labels ----------------
  function updateLabels(n) {
    const S = G.S;
    const nn = S.nations.length;
    for (let k = 0; k < n; k++) {
      labelCursor = labelCursor % (nn - 1) + 1;
      const na = S.nations[labelCursor];
      if (!na || !na.alive || na.tiles <= 0) { if (na) na.label = null; continue; }
      const N = na.tiles;
      const mx = na.sx / N, my = na.sy / N;
      const cxx = na.sxx / N - mx * mx, cyy = na.syy / N - my * my, cxy = na.sxy / N - mx * my;
      const tr = cxx + cyy, det = cxx * cyy - cxy * cxy;
      const l1 = tr / 2 + Math.sqrt(Math.max(0, tr * tr / 4 - det));
      const l2 = Math.max(0.5, tr - l1);
      let ang = 0.5 * Math.atan2(2 * cxy, cxx - cyy);
      if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI;
      ang = U.clamp(ang, -0.7, 0.7);
      const major = Math.sqrt(l1) * 3.2, minor = Math.sqrt(l2) * 3.2;
      let px = Math.round(mx), py = Math.round(my);
      const t = px + py * World.W;
      if (S.owner[t] !== na.id) { const u = G.nearestOwned(na.id, px, py, 40); if (u >= 0) { px = u % World.W; py = (u / World.W) | 0; } }
      const size = Math.max(1.2, Math.min(major / (na.name.length * 0.9 + 2), minor * 0.75, 40));
      na.label = { x: px, y: py, ang, size, major };
    }
  }

  // ---------------- main draw ----------------
  R.frame = function (dtReal) {
    timeNow += dtReal;
    const S = G.S;
    if (cam.tx != null) {
      const k = Math.min(1, dtReal * 4);
      cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k; cam.z += (cam.tz - cam.z) * k;
      if (Math.abs(cam.tx - cam.x) < 0.3 && Math.abs(cam.tz - cam.z) < 0.02) cam.tx = null;
      R.clampCam();
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    let shx = 0, shy = 0;
    if (R.shake > 0.1) { shx = U.R.range(-R.shake, R.shake); shy = U.R.range(-R.shake, R.shake); R.shake *= Math.pow(0.02, dtReal); }
    ctx.translate(shx, shy);
    ctx.fillStyle = '#060709'; ctx.fillRect(-20, -20, VW + 40, VH + 40);
    ctx.imageSmoothingEnabled = false;
    // visible world rect
    const [wx0, wy0] = R.s2w(0, 0), [wx1, wy1] = R.s2w(VW, VH);
    const sx0 = Math.max(0, Math.floor(wx0)), sy0 = Math.max(0, Math.floor(wy0));
    const sx1 = Math.min(World.W, Math.ceil(wx1)), sy1 = Math.min(World.H, Math.ceil(wy1));
    if (sx1 > sx0 && sy1 > sy0) {
      const [dx, dy] = R.w2s(sx0, sy0);
      const dw = (sx1 - sx0) * cam.z, dh = (sy1 - sy0) * cam.z;
      ctx.drawImage(terrainCv, sx0, sy0, sx1 - sx0, sy1 - sy0, dx, dy, dw, dh);
      if (S) {
        if (R.prof) { const t0 = performance.now(); flushTerritory(); R.prof.flush = (R.prof.flush || 0) + performance.now() - t0; } else flushTerritory();
        ctx.drawImage(terrCv, sx0, sy0, sx1 - sx0, sy1 - sy0, dx, dy, dw, dh);
        // fresh (soft) land: crisp screen-space hatching at every zoom level
        const bw = cv.width, bh = cv.height;
        if (stripeCv.width !== bw || stripeCv.height !== bh) { stripeCv.width = bw; stripeCv.height = bh; }
        stripeCtx.setTransform(1, 0, 0, 1, 0, 0);
        stripeCtx.globalCompositeOperation = 'source-over';
        stripeCtx.clearRect(0, 0, bw, bh);
        stripeCtx.imageSmoothingEnabled = false;
        stripeCtx.drawImage(softCv, sx0, sy0, sx1 - sx0, sy1 - sy0, (dx + shx) * DPR, (dy + shy) * DPR, dw * DPR, dh * DPR);
        stripeCtx.globalCompositeOperation = 'source-in';
        stripeCtx.fillStyle = stripePat;
        stripeCtx.fillRect(0, 0, bw, bh);
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.33;
        ctx.drawImage(stripeCv, 0, 0);
        ctx.restore();
      }
    }
    // screen grid (tactical)
    drawGrid();
    if (!S) return;
    ctx.imageSmoothingEnabled = true;
    const P = R.prof;
    const T = P ? (k, fn) => { const t0 = performance.now(); fn(); P[k] = (P[k] || 0) + performance.now() - t0; } : (k, fn) => fn();
    T('labelsU', () => updateLabels(6));
    T('fallout', drawFallout);
    T('storms', () => drawStorms(true));
    T('roads', drawRoads);
    T('ranges', drawRanges);
    T('ally', drawAllyLines);
    T('deposits', drawDeposits);
    T('structs', drawStructs);
    T('convoys', drawConvoys);
    T('ships', drawShips);
    T('capitals', drawCapitals);
    T('attacks', drawAttacks);
    T('missiles', drawMissiles);
    T('effects', () => drawEffects(dtReal));
    T('storms2', () => drawStorms(false));
    T('labels', drawLabels);
    T('cursor', drawCursor);
    miniT -= dtReal;
    T('mini', () => { if (miniT <= 0) { miniT = 0.4; drawMinimap(); } drawMiniView(); });
  };

  function drawGrid() {
    const step = 100;
    ctx.strokeStyle = 'rgba(255,210,31,0.035)'; ctx.lineWidth = 1;
    ctx.beginPath();
    const [a] = R.s2w(0, 0), [b] = R.s2w(VW, 0);
    for (let x = Math.floor(a / step) * step; x <= b; x += step) { const [sx] = R.w2s(x, 0); ctx.moveTo(Math.round(sx) + 0.5, 0); ctx.lineTo(Math.round(sx) + 0.5, VH); }
    const [, c] = R.s2w(0, 0), [, d] = R.s2w(0, VH);
    for (let y = Math.floor(c / step) * step; y <= d; y += step) { const [, sy] = R.w2s(0, y); ctx.moveTo(0, Math.round(sy) + 0.5); ctx.lineTo(VW, Math.round(sy) + 0.5); }
    ctx.stroke();
  }

  function onScreen(x, y, m) { const [sx, sy] = R.w2s(x, y); m = m || 40; return sx > -m && sy > -m && sx < VW + m && sy < VH + m; }

  function drawFallout() {
    const S = G.S;
    for (const f of S.fallout) {
      if (!onScreen(f.x, f.y, f.r * cam.z + 20)) continue;
      const [sx, sy] = R.w2s(f.x, f.y);
      const life = (f.until - S.t) / C.FALLOUT_SECONDS;
      const r = f.r * cam.z;
      const g = ctx.createRadialGradient(sx, sy, r * 0.1, sx, sy, r);
      const a = 0.28 * Math.min(1, life * 1.5) * (0.85 + 0.15 * Math.sin(timeNow * 3 + f.x));
      g.addColorStop(0, `rgba(190,255,60,${a})`); g.addColorStop(0.6, `rgba(150,200,40,${a * 0.6})`); g.addColorStop(1, 'rgba(120,160,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
      if (cam.z > 1.5) {
        ctx.strokeStyle = `rgba(200,255,80,${0.25 * life})`; ctx.setLineDash([4, 6]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  function drawStorms(under) {
    const S = G.S;
    for (const s of S.storms) {
      if (!onScreen(s.x, s.y, s.r * cam.z + 40)) continue;
      const [sx, sy] = R.w2s(s.x, s.y);
      const r = s.r * cam.z * s.k;
      if (under) {
        const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
        g.addColorStop(0, 'rgba(20,24,32,0.45)'); g.addColorStop(1, 'rgba(20,24,32,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
        continue;
      }
      ctx.save();
      ctx.globalAlpha = 0.5 * s.k;
      for (let k = 0; k < 7; k++) {
        const a = s.seed + k * 0.9 + timeNow * 0.08 * (k % 2 ? 1 : -1);
        const cx = sx + Math.cos(a) * r * 0.45, cy = sy + Math.sin(a) * r * 0.35;
        const rr = r * (0.35 + 0.12 * Math.sin(k * 3.1 + timeNow * 0.3));
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
        g.addColorStop(0, 'rgba(170,178,190,0.5)'); g.addColorStop(1, 'rgba(120,128,140,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill();
      }
      // rain
      ctx.strokeStyle = 'rgba(180,200,230,0.35)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let k = 0; k < 40; k++) {
        const h = U.hash2(k, s.id, 7), h2 = U.hash2(k, s.id, 9);
        const rx = sx + (h - 0.5) * r * 1.4, ry = sy + (((h2 + timeNow * 0.9) % 1) - 0.5) * r * 1.2;
        ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 9);
      }
      ctx.stroke();
      // lightning flicker
      if (U.hash2(Math.floor(timeNow * 3), s.id, 3) > 0.96) { ctx.fillStyle = 'rgba(255,255,220,0.15)'; ctx.beginPath(); ctx.arc(sx, sy, r * 0.7, 0, 7); ctx.fill(); }
      ctx.restore();
    }
  }

  function drawRoads() {
    const S = G.S;
    if (cam.z < 1.1) return;
    const p = G.player();
    const showOthers = cam.z >= 3;
    for (const r of S.roads) {
      const mine = p && (r.owner === p.id || G.isAllied(r.owner, p.id));
      if (!mine && !showOthers) continue;
      const [x1, y1] = R.w2s(r.x1, r.y1), [x2, y2] = R.w2s(r.x2, r.y2);
      if (Math.max(x1, x2) < -10 || Math.min(x1, x2) > VW + 10 || Math.max(y1, y2) < -10 || Math.min(y1, y2) > VH + 10) continue;
      const k = mine ? 1 : 0.4;
      if (r.kind === 'white') { ctx.strokeStyle = `rgba(240,238,225,${0.42 * k})`; ctx.lineWidth = U.clamp(cam.z * 0.3, 1.2, 3); }
      else { ctx.strokeStyle = `rgba(170,168,155,${0.3 * k})`; ctx.lineWidth = U.clamp(cam.z * 0.15, 0.8, 1.6); }
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  function circle(x, y, r, stroke, fill, dash) {
    const [sx, sy] = R.w2s(x, y);
    ctx.beginPath(); ctx.arc(sx, sy, r * cam.z, 0, 7);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; if (dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
  }

  function drawRanges() {
    const S = G.S, H = MP.HUD;
    const p = G.player();
    const mode = H && H.mode;
    if (mode && mode.kind === 'build' && R.hover.t >= 0) {
      const type = mode.type;
      const rangeOf = { factory: C.FACTORY_RANGE, hub: C.HUB_RANGE, fort: C.FORT_RADIUS, radar: C.DEFENSE.radar.range * (p ? G.mod(p, 'radarRange') : 1),
        sam: C.DEFENSE.sam.range, abm: C.DEFENSE.abm.range, laser: C.DEFENSE.laser.range, aegis: C.DEFENSE.aegis.range }[type];
      if (rangeOf) circle(R.hover.x + 0.5, R.hover.y + 0.5, rangeOf, 'rgba(255,240,200,0.55)', 'rgba(255,240,200,0.04)');
      // highlight upgrade targets of this type
      if (p) for (const s of p.st[type] || []) {
        const [sx, sy] = R.w2s(s.x, s.y);
        const hs = Math.max(14, cam.z * 5);
        ctx.fillStyle = 'rgba(255,210,31,0.12)'; ctx.strokeStyle = 'rgba(255,210,31,0.55)'; ctx.lineWidth = 1;
        ctx.fillRect(sx - hs, sy - hs, hs * 2, hs * 2); ctx.strokeRect(sx - hs, sy - hs, hs * 2, hs * 2);
      }
      if (type === 'enrich') for (const d of World.deposits) if (!d.plant && p && S.owner[d.tile] === p.id) circle(d.x, d.y, 6, 'rgba(255,210,31,0.8)', 'rgba(255,210,31,0.1)');
    }
    if (mode && mode.kind === 'weapon' && R.hover.t >= 0) {
      const def = C.WEAPON[mode.w];
      const hx = R.hover.wx, hy = R.hover.wy;
      circle(hx, hy, def.radius, 'rgba(255,68,51,0.9)', 'rgba(255,68,51,0.12)');
      if (mode.w === 'MIRV') circle(hx, hy, def.spread + def.radius, 'rgba(255,68,51,0.5)', null, [4, 4]);
      // range of launchers
      if (p && def.range) {
        const ls = def.from === 'silo' ? p.st.silo : p.st.city;
        for (const s of ls) circle(s.x, s.y, def.range, 'rgba(255,210,31,0.18)', null, [2, 6]);
      }
    }
    // hovering one of our structures: show its range
    const hs = R.hoverStruct;
    if (hs && !mode) {
      const rr = hs.type === 'fort' ? C.FORT_RADIUS * Math.pow(2, hs.level - 1) : hs.type === 'factory' ? C.FACTORY_RANGE : hs.type === 'hub' ? C.HUB_RANGE :
        C.DEFENSE[hs.type] ? (C.DEFENSE[hs.type].range * (hs.type === 'radar' ? (1 + 0.25 * (hs.level - 1)) * G.mod(S.nations[hs.owner], 'radarRange') : 1)) : 0;
      if (rr) circle(hs.x, hs.y, rr, 'rgba(255,240,200,0.5)', 'rgba(255,240,200,0.03)');
    }
    // radar rings (player) — subtle sweep
    if (p && p.alive && cam.z > 0.8) {
      for (const r of p.st.radar) {
        if (!G.isActive(r)) continue;
        const rr = C.DEFENSE.radar.range * G.mod(p, 'radarRange') * (1 + 0.25 * (r.level - 1));
        const [sx, sy] = R.w2s(r.x, r.y);
        const a = (timeNow * 1.4 + r.id) % (Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,210,31,0.10)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(sx, sy, rr * cam.z, 0, 7); ctx.stroke();
        const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, rr * cam.z);
        g.addColorStop(0, 'rgba(255,210,31,0.10)'); g.addColorStop(1, 'rgba(255,210,31,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.arc(sx, sy, rr * cam.z, a - 0.5, a); ctx.closePath(); ctx.fill();
      }
    }
  }

  function nationCenter(n) { if (n.label) return [n.label.x, n.label.y]; if (n.tiles) return [n.sx / n.tiles, n.sy / n.tiles]; return [n.capX, n.capY]; }

  function drawAllyLines() {
    const S = G.S;
    const o = R.hover.owner;
    if (!o) return;
    const n = S.nations[o];
    if (!n || !n.alive) return;
    const allies = [];
    for (const a of n.allies) if (S.nations[a] && S.nations[a].alive) allies.push(S.nations[a]);
    if (n.team) for (const m of S.nations) if (m && m.alive && m.id !== n.id && m.team === n.team && !allies.includes(m)) allies.push(m);
    if (!allies.length) return;
    const [ax, ay] = nationCenter(n);
    const [sx, sy] = R.w2s(ax, ay);
    ctx.strokeStyle = 'rgba(62,230,255,0.85)'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (const m of allies) { const [bx, by] = nationCenter(m); const [tx, ty] = R.w2s(bx, by); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); }
    ctx.stroke();
  }

  function drawDeposits() {
    if (cam.z < 0.9) return;
    const S = G.S;
    const size = U.clamp(cam.z * 3.2, 9, 18);
    for (const d of World.deposits) {
      if (d.plant) continue;
      if (!onScreen(d.x, d.y)) continue;
      const [sx, sy] = R.w2s(d.x + 0.5, d.y + 0.5);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(10,10,8,0.65)'; ctx.beginPath(); ctx.arc(sx, sy, size * 0.62, 0, 7); ctx.fill();
      MP.Icons.drawGlyph(ctx, 'nuke', sx - size / 2, sy - size / 2, size, S.owner[d.tile] ? '#ffd21f' : '#c9a516');
      ctx.globalAlpha = 1;
    }
  }

  function drawStructs() {
    const S = G.S;
    const p = G.player();
    const base = U.clamp(cam.z * 3.6, 9, 24);
    R.hoverStruct = null;
    for (const s of S.structs) {
      if (!onScreen(s.x, s.y)) continue;
      const big = s.type === 'city' || s.type === 'silo' || s.type === 'port';
      const mine = p && (s.owner === p.id || G.isAllied(s.owner, p.id));
      if (mine) { if (cam.z < 0.9 && !big) continue; if (cam.z < 0.55) continue; }
      else { if (cam.z < (big ? 1.7 : 2.6)) continue; }
      const n = S.nations[s.owner];
      const size = Math.round(base * (s.type === 'city' ? 1.05 : 0.92));
      const [sx, sy] = R.w2s(s.x + 0.5, s.y + 0.5);
      const glyph = { city: 'city', port: 'port', factory: 'factory', hub: 'hub', enrich: 'enrich', fort: 'fort', silo: 'silo', radar: 'radar', sam: 'sam', abm: 'abm', laser: 'laser', aegis: 'aegis' }[s.type];
      const spr = MP.Icons.sprite(glyph, n.color, Math.max(12, Math.round(size * DPR)));
      ctx.globalAlpha = s.build > 0 ? 0.55 : (s.disabledUntil > S.t ? 0.4 + 0.3 * Math.sin(timeNow * 20) : 1);
      ctx.drawImage(spr, sx - size / 2, sy - size / 2, size, size);
      ctx.globalAlpha = 1;
      if (s.build > 0 && s.buildMax) {
        ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, size * 0.62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - s.build / s.buildMax)); ctx.stroke();
      }
      if (s.level > 1 && cam.z > 1.4) {
        ctx.fillStyle = '#ffd21f'; ctx.font = `bold ${Math.max(8, size * 0.38)}px ${MP.FONT_MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(s.level, sx + size * 0.36, sy - size * 0.62);
      }
      if (s.type === 'silo' && n === p && s.ready > 0 && s.build <= 0) {
        ctx.fillStyle = '#ff4433'; ctx.beginPath(); ctx.arc(sx + size * 0.45, sy + size * 0.45, 3, 0, 7); ctx.fill();
      }
      if (Math.abs(R.hover.sx - sx) < size / 2 && Math.abs(R.hover.sy - sy) < size / 2) R.hoverStruct = s;
    }
  }

  function drawConvoys() {
    if (cam.z < 1.3) return;
    const S = G.S;
    const sz = Math.max(2, cam.z * 0.7);
    for (const cv2 of S.convoys) {
      if (cv2.x == null || !onScreen(cv2.x, cv2.y, 5)) continue;
      const [sx, sy] = R.w2s(cv2.x + 0.5, cv2.y + 0.5);
      ctx.fillStyle = cv2.back ? 'rgba(255,90,60,0.9)' : (cv2.viaHub ? 'rgba(255,236,170,0.95)' : 'rgba(255,196,60,0.9)');
      ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
    }
  }

  function drawShip(sh, sx, sy, col, scale) {
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(sh.ang || 0); ctx.scale(scale, scale);
    ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 0.15;
    ctx.beginPath();
    if (sh.kind === 'warship') { ctx.moveTo(1.4, 0); ctx.lineTo(0.5, -0.55); ctx.lineTo(-1.1, -0.5); ctx.lineTo(-1.1, 0.5); ctx.lineTo(0.5, 0.55); }
    else if (sh.kind === 'transport') { ctx.moveTo(1, 0); ctx.lineTo(0.4, -0.5); ctx.lineTo(-0.9, -0.5); ctx.lineTo(-0.9, 0.5); ctx.lineTo(0.4, 0.5); }
    else { ctx.moveTo(0.8, 0); ctx.lineTo(0.2, -0.38); ctx.lineTo(-0.7, -0.38); ctx.lineTo(-0.7, 0.38); ctx.lineTo(0.2, 0.38); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if (sh.kind === 'warship') { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-0.4, -0.22, 0.6, 0.44); }
    ctx.restore();
  }

  function drawShips() {
    const S = G.S, p = G.player();
    for (const sh of S.ships) {
      if (sh.kind === 'trade' && cam.z < 1.2) continue;
      if (!onScreen(sh.x, sh.y, 30)) { if (sh.kind !== 'transport') continue; }
      const n = S.nations[sh.owner];
      const [sx, sy] = R.w2s(sh.x, sh.y);
      const sc = sh.kind === 'warship' ? U.clamp(cam.z * 2.2, 5, 14) : sh.kind === 'transport' ? U.clamp(cam.z * 2, 5, 12) : U.clamp(cam.z * 1.6, 3, 9);
      if (sh.kind === 'transport') {
        // dotted path to landing; red reticle if it targets the player or allies
        const lx = sh.landing % World.W, ly = (sh.landing / World.W) | 0;
        const hostileToUs = p && (sh.target === p.id || (sh.target && G.isAllied(sh.target, p.id) && sh.owner !== p.id));
        if (sh.owner === p?.id || hostileToUs) {
          ctx.fillStyle = hostileToUs ? 'rgba(255,68,51,0.8)' : 'rgba(255,210,31,0.7)';
          let px = sh.x, py = sh.y;
          const pts = [[sh.x, sh.y]].concat(sh.path.slice(sh.pi));
          for (let k = 1; k < pts.length; k++) {
            const [ax, ay] = pts[k - 1], [bx, by] = pts[k];
            const len = Math.hypot(bx - ax, by - ay);
            for (let d = 0; d < len; d += 4) { const [qx, qy] = R.w2s(ax + (bx - ax) * d / len, ay + (by - ay) * d / len); ctx.fillRect(qx - 1, qy - 1, 2, 2); }
            px = bx; py = by;
          }
          const [rx, ry] = R.w2s(lx + 0.5, ly + 0.5);
          ctx.strokeStyle = hostileToUs ? '#ff4433' : '#ffd21f'; ctx.lineWidth = 1.5;
          const pr = 8 + 3 * Math.sin(timeNow * 6);
          ctx.beginPath(); ctx.arc(rx, ry, pr, 0, 7); ctx.stroke();
          ctx.beginPath(); ctx.arc(rx, ry, pr * 2.2, 0, 7); ctx.globalAlpha = 0.4; ctx.stroke(); ctx.globalAlpha = 1;
          ctx.beginPath(); ctx.moveTo(rx - 4, ry); ctx.lineTo(rx + 4, ry); ctx.moveTo(rx, ry - 4); ctx.lineTo(rx, ry + 4); ctx.stroke();
        }
      }
      if (!onScreen(sh.x, sh.y, 30)) continue;
      const col = sh.state === 'building' ? 'rgba(150,150,150,0.6)' : U.rgb(n.color);
      drawShip(sh, sx, sy, col, sc);
      if (sh.kind !== 'trade' && sh.hp < sh.maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(sx - 10, sy - sc - 6, 20, 3);
        ctx.fillStyle = '#ff4433'; ctx.fillRect(sx - 10, sy - sc - 6, 20 * sh.hp / sh.maxHp, 3);
      }
      if (sh.kind === 'transport' && cam.z > 1.5 && p && (sh.owner === p.id || sh.target === p.id)) {
        ctx.font = `bold 10px ${MP.FONT_MONO}`; ctx.fillStyle = '#ece6cf'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(U.fmtK(sh.troops), sx, sy - sc);
      }
      if (sh === R.selectedShip) { ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx, sy, sc * 1.6, 0, 7); ctx.stroke(); circle(sh.patrolX, sh.patrolY, C.WARSHIP.patrol * 0.6, 'rgba(255,210,31,0.4)', null, [3, 5]); }
      if (sh.kind === 'warship' && sh.owner === p?.id) sh._sx = sx, sh._sy = sy;
    }
  }

  function drawCapitals() {
    const S = G.S, p = G.player();
    if (cam.z < 0.7) return;
    for (const n of S.nations) {
      if (!n || !n.alive || n.capital < 0) continue;
      if (!onScreen(n.capX, n.capY)) continue;
      const [sx, sy] = R.w2s(n.capX + 0.5, n.capY + 0.5);
      const sz = U.clamp(cam.z * 4.5, 12, 26);
      if (n === p) {
        ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, sy, sz * 0.75 + Math.sin(timeNow * 3) * 1.5, 0, 7); ctx.stroke();
      }
      const spr = MP.Icons.sprite('capital', n === p ? [255, 210, 31] : n.color, Math.round(sz * DPR), { round: true });
      ctx.drawImage(spr, sx - sz / 2, sy - sz / 2, sz, sz);
      // chevron marker above enemy capital at war with us
      if (p && n !== p && n.wars.has(p.id)) {
        ctx.fillStyle = '#ff4433';
        ctx.beginPath(); ctx.moveTo(sx - 6, sy - sz * 0.9 - 6); ctx.lineTo(sx, sy - sz * 0.9); ctx.lineTo(sx + 6, sy - sz * 0.9 - 6); ctx.lineTo(sx + 6, sy - sz * 0.9 - 3); ctx.lineTo(sx, sy - sz * 0.9 + 3); ctx.lineTo(sx - 6, sy - sz * 0.9 - 3); ctx.fill();
      }
    }
  }

  function pill(sx, sy, text, fg, bg, border) {
    ctx.font = `bold 11px ${MP.FONT_MONO}`;
    const w = ctx.measureText(text).width + 14;
    ctx.fillStyle = bg; ctx.strokeStyle = border; ctx.lineWidth = 1;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(sx - w / 2, sy - 9, w, 18, 9); else ctx.rect(sx - w / 2, sy - 9, w, 18);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, sx, sy + 0.5);
  }

  // front-line geometry (centre, along-front angle, normal pointing at the attacker), cached briefly.
  // With a clicked point of main effort, the geometry follows the part of the front nearest to it.
  function frontGeom(at) {
    if (at._g && timeNow - at._g.t < 0.35 && at._g.z === cam.z) return at._g;
    const S = G.S, W = World.W, f = at.front;
    if (!f.length) return null;
    const step = Math.max(1, Math.floor(f.length / 240));
    let pts = [];
    for (let i = 0; i < f.length; i += step) { const t = f[i]; pts.push([t % W, (t / W) | 0]); }
    if (at.fx != null && at.press > 0.1 && pts.length > 12) {
      pts.sort((a, b) => ((a[0] - at.fx) ** 2 + (a[1] - at.fy) ** 2) - ((b[0] - at.fx) ** 2 + (b[1] - at.fy) ** 2));
      pts = pts.slice(0, Math.max(10, Math.round(pts.length * 0.4)));
    }
    let mx = 0, my = 0;
    for (const q of pts) { mx += q[0]; my += q[1]; }
    const c = pts.length; mx /= c; my /= c;
    let cxx = 0, cyy = 0, cxy = 0;
    for (const q of pts) { const dx = q[0] - mx, dy = q[1] - my; cxx += dx * dx; cyy += dy * dy; cxy += dx * dy; }
    const ang = 0.5 * Math.atan2(2 * cxy, cxx - cyy);
    const a = S.nations[at.from];
    let nx = -Math.sin(ang), ny = Math.cos(ang);
    // point the normal at the attacker using local ownership, not the (possibly far) centroid
    const probe = (k) => { const x = Math.round(mx + nx * k), y = Math.round(my + ny * k); return x >= 0 && y >= 0 && x < W && y < World.H ? S.owner[x + y * W] : -1; };
    let sA = 0; for (let k = 1; k <= 6; k++) { if (probe(k) === at.from) sA++; if (probe(-k) === at.from) sA--; }
    if (sA < 0 || (sA === 0 && a && a.tiles && ((a.sx / a.tiles - mx) * nx + (a.sy / a.tiles - my) * ny) < 0)) { nx = -nx; ny = -ny; }
    let la = ang; if (la > Math.PI / 2) la -= Math.PI; if (la < -Math.PI / 2) la += Math.PI;
    at._g = { t: timeNow, z: cam.z, x: mx, y: my, ang: la, nx, ny, fits: {} };
    return at._g;
  }

  // find a spot where the whole number sits inside `owner`'s land (never spilling over the border)
  function fitInside(g, side, owner, text, px) {
    const key = side + '|' + text.length + '|' + Math.round(px);
    if (g.fits[key] !== undefined) return g.fits[key];
    const S = G.S, W = World.W;
    ctx.font = `800 ${px}px ${MP.FONT_HEAD}`;
    const wT = ctx.measureText(text).width / cam.z + 1, hT = px / cam.z + 0.6;
    const ux = Math.cos(g.ang), uy = Math.sin(g.ang), vx = -uy, vy = ux;
    const nx = g.nx * side, ny = g.ny * side;
    const inside = (cx, cy) => {
      for (let i = -2; i <= 2; i++) for (let j = -1; j <= 1; j += 2) {
        const x = Math.round(cx + ux * wT * 0.25 * i + vx * hT * 0.5 * j), y = Math.round(cy + uy * wT * 0.25 * i + vy * hT * 0.5 * j);
        if (x < 0 || y < 0 || x >= W || y >= World.H || S.owner[x + y * W] !== owner) return false;
      }
      return true;
    };
    let res = null;
    const d0 = hT * 0.55 + 0.8;
    outer: for (let d = d0; d < d0 + 40; d += Math.max(0.8, hT * 0.25)) {
      for (const sh of [0, 0.6, -0.6, 1.2, -1.2]) {
        const cx = g.x + nx * d + ux * wT * sh, cy = g.y + ny * d + uy * wT * sh;
        if (inside(cx, cy)) { res = [cx, cy]; break outer; }
      }
    }
    g.fits[key] = res;
    return res;
  }

  function frontNumber(x, y, ang, text, px, fill, accent) {
    const [sx, sy] = R.w2s(x, y);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(ang);
    ctx.font = `800 ${px}px ${MP.FONT_HEAD}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(4,4,3,0.85)'; ctx.lineWidth = Math.max(3, px * 0.22);
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = fill; ctx.fillText(text, 0, 0);
    if (accent) { const w = ctx.measureText(text).width; ctx.fillStyle = accent; ctx.fillRect(-w / 2, px * 0.5, w, Math.max(1.5, px * 0.08)); }
    ctx.restore();
  }
  function placeNumber(g, side, owner, text, px, fill, accent) {
    let pos = fitInside(g, side, owner, text, px), size = px;
    if (!pos) { size = px * 0.72; pos = fitInside(g, side, owner, text, size); }
    if (pos) frontNumber(pos[0], pos[1], g.ang, text, size, fill, accent);
  }

  function drawAttacks() {
    const S = G.S, p = G.player();
    const fs = U.clamp(cam.z * 4.2, 11, 22);
    for (const at of S.attacks) {
      if (at.done || !at.front.length) continue;
      const mine = p && at.from === p.id, onUs = p && at.to === p.id;
      const watch = !p || S.opts.mode === 'watch';
      if (!mine && !onUs && (cam.z < (watch ? 1.0 : 2.2) || at.troops < 2500)) continue;
      const g = frontGeom(at);
      if (!g || !onScreen(g.x, g.y, 80)) continue;
      if (onUs) {
        ctx.fillStyle = 'rgba(255,68,51,0.35)';
        const sz = Math.max(2, cam.z);
        for (let i = 0; i < at.front.length; i += Math.max(1, Math.floor(at.front.length / 300))) {
          const t = at.front[i]; const [fx, fy] = R.w2s(t % World.W, (t / World.W) | 0); ctx.fillRect(fx, fy, sz, sz);
        }
      }
      const an = S.nations[at.from], dn = at.to ? S.nations[at.to] : null;
      // the attacker's committed troops — strictly inside the attacker's land, where the effort is concentrated
      placeNumber(g, 1, at.from, U.fmtInt(at.troops), fs, onUs ? '#ffc2b8' : '#ffffff', an ? U.rgb(an.color) : null);
      // defenders show a number only once they commit troops — strictly inside the defender's land
      if (dn && at.def > 0) placeNumber(g, -1, at.to, U.fmtInt(at.def), fs * 0.92, mine ? '#ffc2b8' : '#ffffff', U.rgb(dn.color));
    }
    // breakout zones (Call for the Motherland)
    if (S.tempForts) for (const tf of S.tempForts) {
      if (!onScreen(tf.x, tf.y, tf.r * cam.z + 20)) continue;
      const [sx, sy] = R.w2s(tf.x, tf.y);
      ctx.save(); ctx.strokeStyle = 'rgba(255,210,31,0.85)'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.lineDashOffset = timeNow * 10;
      ctx.beginPath(); ctx.arc(sx, sy, tf.r * cam.z, 0, 7); ctx.stroke(); ctx.restore();
    }
    if (p && S.ghostForts && S.ghostForts.size && cam.z > 1.5) for (const [t, gf] of S.ghostForts) {
      if (gf.owner !== p.id) continue;
      const x = t % World.W, y = (t / World.W) | 0;
      if (!onScreen(x, y)) continue;
      const [sx, sy] = R.w2s(x + 0.5, y + 0.5);
      ctx.globalAlpha = 0.45; MP.Icons.drawGlyph(ctx, 'fort', sx - 7, sy - 7, 14, '#c9b88a'); ctx.globalAlpha = 1;
    }
    // encircled pockets
    if (S.pockets) for (const pk of S.pockets) {
      const inv = p && (pk.nation === p.id || pk.by === p.id);
      if (!inv && cam.z < 1.3) continue;
      if (!onScreen(pk.x, pk.y)) continue;
      const [sx, sy] = R.w2s(pk.x, pk.y);
      const r = Math.max(8, Math.sqrt(pk.size) * cam.z * 0.6);
      ctx.save();
      ctx.strokeStyle = pk.nation === p?.id ? 'rgba(255,68,51,0.9)' : 'rgba(236,230,207,0.85)'; ctx.lineWidth = 2;
      ctx.setLineDash([3, 4]); ctx.lineDashOffset = -timeNow * 12;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
      ctx.font = `700 ${U.clamp(fs * 0.8, 10, 17)}px ${MP.FONT_HEAD}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.lineJoin = 'round';
      const txt = U.fmtInt(pk.troops) + (pk.breakout ? ' Breaking Out' : ' Encircled');
      ctx.strokeStyle = 'rgba(4,4,3,0.85)'; ctx.lineWidth = 3; ctx.strokeText(txt, sx, sy - r - 3);
      ctx.fillStyle = pk.nation === p?.id ? '#ff8a7a' : 'rgba(236,230,207,0.92)'; ctx.fillText(txt, sx, sy - r - 3);
    }
  }

  function drawMissiles() {
    const S = G.S, p = G.player();
    for (const m of S.missiles) {
      const visible = !p || m.owner === p.id || m.seen || m.target === p.id || G.isAllied(m.owner, p.id) || S.opts.mode === 'watch' || m.orbital;
      if (!visible) continue;
      const own = p && m.owner === p.id;
      const hostile = p && m.target === p.id;
      const col = hostile ? [255, 68, 51] : own ? [255, 210, 31] : [255, 170, 120];
      if (m.orbital) {
        const k = m.t / m.T;
        const [sx, sy] = R.w2s(m.x1, m.y1);
        ctx.strokeStyle = `rgba(255,230,160,${0.25 + 0.6 * k})`; ctx.lineWidth = 1 + k * 5;
        ctx.beginPath(); ctx.moveTo(sx, sy - VH); ctx.lineTo(sx, sy); ctx.stroke();
        ctx.strokeStyle = `rgba(255,68,51,${0.5 + 0.5 * Math.sin(timeNow * 20)})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(sx, sy, C.WEAPON.Orbital.radius * cam.z * (1.2 - k * 0.4), 0, 7); ctx.stroke();
        continue;
      }
      // trail
      const f = Math.min(1, m.t / m.T);
      const lift = m.liftFrom || 0;
      const pt = (ff) => {
        const x = m.x0 + (m.x1 - m.x0) * ff, y = m.y0 + (m.y1 - m.y0) * ff;
        const len = Math.hypot(m.x1 - m.x0, m.y1 - m.y0);
        const h = (m.arc || 0) * len * 4 * ff * (1 - ff) + lift * (1 - ff);
        return R.w2s(x, y - h);
      };
      ctx.lineWidth = m.style === 'ghost' ? 1 : 1.6;
      const seg = 24;
      const start = m.style === 'comet' ? Math.max(0, f - 0.25) : 0;
      ctx.beginPath();
      for (let k = 0; k <= seg; k++) {
        const ff = start + (f - start) * k / seg;
        const [x, y] = pt(ff);
        if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      const grad = U.rgb(col, m.style === 'ghost' ? 0.35 : 0.75);
      ctx.strokeStyle = grad;
      if (m.style === 'tracer') ctx.setLineDash([6, 4]);
      ctx.stroke(); ctx.setLineDash([]);
      // projected remainder (dashed) for our/hostile missiles
      if (own || hostile) {
        ctx.beginPath();
        for (let k = 0; k <= 16; k++) { const ff = f + (1 - f) * k / 16; const [x, y] = pt(ff); if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
        ctx.strokeStyle = U.rgb(col, 0.25); ctx.setLineDash([3, 5]); ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
        const [tx, ty] = R.w2s(m.x1, m.y1);
        ctx.strokeStyle = U.rgb(col, 0.5 + 0.4 * Math.sin(timeNow * 8)); ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(tx, ty, (C.WEAPON[m.w].radius) * cam.z, 0, 7); ctx.stroke();
      }
      const [hx, hy] = pt(f);
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 7);
      g.addColorStop(0, 'rgba(255,255,240,1)'); g.addColorStop(0.4, U.rgb(col, 0.8)); g.addColorStop(1, U.rgb(col, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, 7, 0, 7); ctx.fill();
    }
  }

  function drawEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i];
      e.t += dt;
      if (e.t >= e.life) { effects.splice(i, 1); continue; }
      const k = e.t / e.life;
      if (e.k === 'p') {
        e.x += e.vx * dt; e.y += e.vy * dt;
        const [sx, sy] = R.w2s(e.x, e.y);
        ctx.fillStyle = U.rgb(e.col, 1 - k); ctx.fillRect(sx - 1.5, sy - 1.5, 3, 3);
      } else if (e.k === 'txt') {
        const [sx, sy] = R.w2s(e.x, e.y);
        const yy = sy - 20 - k * 30;
        ctx.globalAlpha = 1 - Math.max(0, k - 0.6) / 0.4;
        ctx.font = `bold 14px ${MP.FONT_MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        MP.Icons.drawGlyph(ctx, 'coin', sx - 26, yy - 7, 14, U.rgb(e.col));
        ctx.fillStyle = U.rgb(e.col); ctx.fillText(e.text, sx - 8, yy);
        if (e.sub) { MP.Icons.drawGlyph(ctx, 'nuke', sx - 24, yy + 9, 11, '#a6e35a'); ctx.fillStyle = '#a6e35a'; ctx.font = `bold 11px ${MP.FONT_MONO}`; ctx.fillText(e.sub, sx - 8, yy + 15); }
        ctx.globalAlpha = 1;
      } else if (e.k === 'coin') {
        if (cam.z < 1.2) continue;
        const [sx, sy] = R.w2s(e.x, e.y);
        ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ffd21f';
        ctx.beginPath(); ctx.arc(sx, sy - k * 14, 2.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      } else if (e.k === 'shot') {
        const [a, b] = R.w2s(e.x1, e.y1), [c2, d] = R.w2s(e.x2, e.y2);
        ctx.strokeStyle = `rgba(255,230,140,${1 - k})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c2, d); ctx.stroke();
      } else if (e.k === 'icpt') {
        const [a, b] = R.w2s(e.x1, e.y1), [c2, d] = R.w2s(e.x2, e.y2);
        const kk = Math.min(1, k * 2.2);
        ctx.strokeStyle = e.hit ? `rgba(120,230,255,${1 - k})` : `rgba(200,200,200,${0.7 - k * 0.7})`; ctx.lineWidth = 1.4;

    return `<b>${w}</b> <span class="dim">· DEFCON ${def.defcon}</span><br>` +
      `Research: ${U.fmtK(rc.credits)}${rc.u ? ' · ' + rc.u + 'U' : ''} · ${Math.round(rc.time)}s<br>` +
      `Launch: ${U.fmtK(lc.credits)}${lc.u ? ' · ' + lc.u + 'U' : ''} · radius ${def.radius}${def.range ? ' · range ' + def.range : ''}` +
      (def.warheads ? `<br>Splits into ${def.warheads} warheads mid-flight` : '') +
      (def.from === 'silo' ? '<br>Fires from a ready silo' : def.from === 'city' ? '<br>Flies from your cities' : '<br>Orbital platform · 3s charge') +
      `<br><span class="dim">Countered by: ${counters.join(', ') || 'nothing'}</span>`;
  }

  // ---------------- input ----------------
  HUD.bindInput = function () {
    const cv = document.getElementById('map');
    let down = null, dragging = false;
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('mousedown', (e) => {
      MP.audio.unlock();
      HUD.closeRadial(e.target);
      if (e.button === 1 || e.button === 0) down = { x: e.clientX, y: e.clientY, b: e.button, shift: e.shiftKey };
      if (e.button === 2) { HUD.onRightClick(e); }
    });
    window.addEventListener('mousemove', (e) => {
      if (down && (Math.abs(e.clientX - down.x) > 4 || Math.abs(e.clientY - down.y) > 4)) dragging = true;
      if (down && dragging) { MP.Render.pan(e.movementX, e.movementY); }
      if (e.target === cv) HUD.updateHover(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', (e) => {
      if (down && !dragging && e.target === cv && down.b === 0) HUD.onClick(e);
      down = null; dragging = false;
    });
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      MP.Render.zoomAt(e.clientX, e.clientY, Math.pow(1.0015, -e.deltaY));
    }, { passive: false });
    // touch: one-finger pan, pinch zoom, tap = click
    let touches = null;
    cv.addEventListener('touchstart', (e) => { MP.audio.unlock(); touches = Array.from(e.touches).map((t) => ({ x: t.clientX, y: t.clientY })); touches.moved = false; }, { passive: true });
    cv.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const ts = Array.from(e.touches).map((t) => ({ x: t.clientX, y: t.clientY }));
      if (!touches) { touches = ts; return; }
      if (ts.length === 1 && touches.length === 1) { MP.Render.pan(ts[0].x - touches[0].x, ts[0].y - touches[0].y); if (Math.hypot(ts[0].x - touches[0].x, ts[0].y - touches[0].y) > 2) touches.moved = true; }
      if (ts.length === 2 && touches.length === 2) {
        const d0 = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y), d1 = Math.hypot(ts[0].x - ts[1].x, ts[0].y - ts[1].y);
        MP.Render.zoomAt((ts[0].x + ts[1].x) / 2, (ts[0].y + ts[1].y) / 2, d1 / Math.max(1, d0)); touches.moved = true;
      }
      const moved = touches.moved; touches = ts; touches.moved = moved;
    }, { passive: false });
    cv.addEventListener('touchend', (e) => {
      if (touches && !touches.moved && touches.length === 1) { HUD.updateHover(touches[0].x, touches[0].y); HUD.onClick({ clientX: touches[0].x, clientY: touches[0].y, shiftKey: false }); }
      if (!e.touches.length) touches = null;
    });
    // minimap
    els['h-mini'].addEventListener('mousedown', (e) => {
      const r = e.target.getBoundingClientRect();
      const [wx, wy] = MP.Render.miniToWorld(e.clientX - r.left, e.clientY - r.top);
      MP.Render.centerOn(wx, wy, MP.Render.cam.z);
      MP.SFX.play('click');
    });
    // buttons
    document.getElementById('h-resign').addEventListener('click', () => HUD.confirm('Resign the match?', 'Your nation will surrender.', () => MP.Game.resign()));
    document.getElementById('h-settings').addEventListener('click', () => MP.Menu.openSettings(true));
    document.getElementById('h-save').addEventListener('click', () => MP.Game.save(false));
    document.getElementById('h-fs').addEventListener('click', () => MP.toggleFullscreen());
    document.getElementById('h-banner-x').addEventListener('click', () => HUD.clearMode());
    els['h-speed'].addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const sp = Number(b.dataset.sp);
      if (sp === 0) MP.Game.setPaused(!MP.Game.paused); else MP.Game.setSpeed(sp);
      MP.SFX.play('click');
    });
    root.querySelector('.presets').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const r = b.dataset.r;
      if (r === '-') HUD.ratio = Math.max(0.05, Math.round((HUD.ratio - 0.05) * 100) / 100);
      else if (r === '+') HUD.ratio = Math.min(1, Math.round((HUD.ratio + 0.05) * 100) / 100);
      else HUD.ratio = Number(r);
      MP.settings.set('ratio', HUD.ratio);
      MP.SFX.play('click');
      HUD.syncRatio();
    });
    // ui sounds: hover + click on any button
    document.addEventListener('mouseover', (e) => { const b = e.target.closest && e.target.closest('button, .clickable'); if (b && b !== HUD._lastHoverBtn) { HUD._lastHoverBtn = b; MP.SFX.play('hover'); } });
    document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && !b.dataset.silent) MP.SFX.play('click'); }, true);
    window.addEventListener('keydown', HUD.onKey);
  };

  HUD.onKey = function (e) {
    if (!MP.Game.running) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
    const k = e.key;
    const S = G.S;
    if (k === 'Escape') {
      if (HUD.mode || MP.Render.selectedShip) { HUD.clearMode(); MP.Render.selectedShip = null; return; }
      if (els['h-radial'].style.display !== 'none') { HUD.closeRadial(); return; }
      if (document.querySelector('.modal-wrap')) return;
      MP.Menu.openSettings(true); return;
    }
    if (k === ' ') { e.preventDefault(); MP.Game.setPaused(!MP.Game.paused); return; }
    if (S.opts.mode === 'watch') return;
    const up = k.toUpperCase();
    for (const t of C.BUILD_ORDER.concat(C.DEFENSE_ORDER)) if (C.BUILD[t].key === up) { HUD.setBuildMode(t); return; }
    for (const w of C.WEAPON_ORDER) if (C.WEAPON[w].key === up) { HUD.weaponClick(w); return; }
    if (k === '+' || k === '=') { HUD.ratio = Math.min(1, HUD.ratio + 0.05); HUD.syncRatio(); }
    if (k === '-' || k === '_') { HUD.ratio = Math.max(0.05, HUD.ratio - 0.05); HUD.syncRatio(); }
    if (up === 'F') { const p = G.player(); if (p && p.capital >= 0) MP.Render.centerOn(p.capX, p.capY, Math.max(4, MP.Render.cam.z)); }
    if (up === 'L') { HUD.launchAll = !HUD.launchAll; HUD.syncLaunchAll(); MP.SFX.play('toggle'); }
    const pan = 60 / MP.Render.cam.z;
    if (k === 'ArrowLeft' || up === 'A') MP.Render.pan(pan * MP.Render.cam.z, 0);
    if (k === 'ArrowRight' || up === 'D') MP.Render.pan(-pan * MP.Render.cam.z, 0);
    if (k === 'ArrowUp' || up === 'W') MP.Render.pan(0, pan * MP.Render.cam.z);
    if (k === 'ArrowDown' || up === 'S') MP.Render.pan(0, -pan * MP.Render.cam.z);
  };

  HUD.updateHover = function (sx, sy) {
    const [wx, wy] = MP.Render.s2w(sx, sy);
    const x = Math.floor(wx), y = Math.floor(wy);
    const H = MP.Render.hover;
    H.sx = sx; H.sy = sy; H.wx = wx; H.wy = wy;
    if (x < 0 || y < 0 || x >= World.W || y >= World.H) { H.t = -1; H.owner = 0; return; }
    const t = x + y * World.W;
    if (t !== H.t) {
      const S = G.S;
      const o = S ? S.owner[t] : 0;
      if (o !== H.owner) MP.SFX.play('hoverMap');
      H.owner = o;
    }
    H.t = t; H.x = x; H.y = y;
  };

  HUD.onClick = function (e) {
    const S = G.S, p = G.player(), H = MP.Render.hover;
    if (!S || H.t < 0 || S.phase === 'over') return;
    if (S.opts.mode === 'watch' || !p) {
      if (S.owner[H.t]) MP.Render.ping(H.x, H.y, S.nations[S.owner[H.t]].color);
      return;
    }
    if (S.phase === 'spawn') { MP.Game.playerSpawn(H.t, e.shiftKey); return; }
    if (!p.alive) return;
    const mode = HUD.mode;
    if (mode && mode.kind === 'build') {
      const s = MP.Eco.place(p, mode.type, H.t);
      if (s && !e.shiftKey) HUD.clearMode();
      return;
    }
    if (mode && mode.kind === 'weapon') {
      const all = HUD.launchAll || e.shiftKey;
      if (all) MP.Weapons.launchAll(p, mode.w, H.wx, H.wy); else MP.Weapons.launch(p, mode.w, H.wx, H.wy);
      if (!e.shiftKey) HUD.clearMode();
      return;
    }
    // select own warship?
    const R = MP.Render;
    for (const sh of S.ships) {
      if (sh.owner !== p.id || sh.kind !== 'warship' || sh._sx == null) continue;
      if (Math.hypot(sh._sx - H.sx, sh._sy - H.sy) < 14) { R.selectedShip = sh; MP.SFX.play('naval'); HUD.toast('Warship selected — click the sea to set its patrol', 'info'); return; }
    }
    if (R.selectedShip && !World.land[H.t]) {
      MP.Naval.assignPatrol(R.selectedShip, H.wx, H.wy); R.selectedShip = null; MP.SFX.play('send'); HUD.toast('Patrol assigned', 'info'); return;
    }
    R.selectedShip = null;
    if (!World.land[H.t]) return;
    const o = S.owner[H.t];
    if (o === p.id) return;
    HUD.orderAttack(o, H.t);
  };

  HUD.orderAttack = function (o, t) {
    const S = G.S, p = G.player();
    if (o && !G.canAttack(p.id, o)) { HUD.toast(G.isAllied(p.id, o) ? 'That nation is your ally' : G.protectedNow() ? 'Spawn protection — nations can only claim empty land for now' : 'Truce in effect', 'bad'); MP.SFX.play('error'); return; }
    const troops = p.troops * HUD.ratio;
    const H = MP.Render.hover;
    if (MP.War.bordersWith(p.id, o)) {
      // the click is the point of main effort: forces concentrate and break through toward it
      const at = MP.War.launch(p.id, o, troops, { fx: H.wx, fy: H.wy });
      if (at) {
        MP.SFX.play('attack');
        if (o) MP.Game.notify('attack.launched', { target: S.nations[o].name, troops: U.fmtK(troops) });
        else MP.Game.notify('attack.expand', { troops: U.fmtK(troops) });
        HUD.floatOrder(o ? `Attacking ${S.nations[o].name} with ${U.fmtK(troops)}` : `Expanding with ${U.fmtK(troops)}`);
      }
    } else if (World.coast[t] || nearCoast(t)) {
      const r = MP.Naval.launchTransport(p, t, troops);
      if (!r.ok) { HUD.toast(r.reason, 'bad'); MP.SFX.play('error'); }
      else { HUD.floatOrder(`Transport underway with ${U.fmtK(troops)}`); MP.Game.tut('tut.boat'); }
    } else { HUD.toast('No border there — land a transport on the coast instead', 'bad'); MP.SFX.play('error'); }
  };
  function nearCoast(t) { const w = World.W; for (let d = -3; d <= 3; d++) for (let e = -3; e <= 3; e++) { const u = t + d + e * w; if (u >= 0 && u < World.N && World.coast[u]) return true; } return false; }

  HUD.floatOrder = function (text) {
    const H = MP.Render.hover;
    const el = h('div', { class: 'order-float', style: { left: H.sx + 'px', top: (H.sy - 28) + 'px' } }, '⊕ ' + text);
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('out'), 1200);
    setTimeout(() => el.remove(), 1800);
  };

  // ---------------- modes ----------------
  HUD.setBuildMode = function (type) {
    const S = G.S, p = G.player();
    if (!S || !p || !p.alive || S.phase !== 'play') return;
    if (HUD.mode && HUD.mode.kind === 'build' && HUD.mode.type === type) { HUD.clearMode(); return; }
    HUD.mode = { kind: 'build', type };
    HUD.banner(`<img class="ico" src="${MP.Icons.url(C.BUILD[type].icon, '#ffd21f', 32)}"> Place ${C.BUILD[type].name}`);
    MP.SFX.play('open');
    const tutMap = { warship: 'tut.warship', silo: 'tut.silo', radar: 'tut.radar', sam: 'tut.defense', abm: 'tut.defense', laser: 'tut.defense', aegis: 'tut.defense', enrich: 'tut.enrich', hub: 'tut.hub', port: 'tut.port', fort: 'tut.fort', factory: 'tut.factory', city: 'tut.city' };
    if (tutMap[type]) MP.Game.tut(tutMap[type]);
    HUD.syncSlots();
  };
  HUD.weaponClick = function (w) {
    const S = G.S, p = G.player();
    if (!S || !p || !p.alive || S.phase !== 'play') return;
    if (!p.research[w]) {
      if (p.researching && p.researching.w === w) return;
      const r = MP.Weapons.startResearch(p, w);
      if (!r.ok) { HUD.toast(r.reason, 'bad'); MP.SFX.play('error'); }
      return;
    }
    if (HUD.mode && HUD.mode.kind === 'weapon' && HUD.mode.w === w) { HUD.clearMode(); return; }
    HUD.mode = { kind: 'weapon', w };
    HUD.banner(`<img class="ico" src="${MP.Icons.url(C.WEAPON[w].icon, '#ff4433', 32)}"> Target: ${w}${HUD.launchAll ? ' · LAUNCH ALL' : ''} <span class="dim">(shift = all)</span>`, 'red');
    MP.SFX.play('open');
    HUD.syncSlots();
  };
  HUD.clearMode = function () { HUD.mode = null; HUD.banner(null); HUD.syncSlots(); MP.SFX.play('close'); };
  HUD.banner = function (html, kind) {
    const b = els['h-banner'];
    if (!html) { b.style.display = 'none'; return; }
    b.style.display = ''; b.className = 'banner ' + (kind || '');
    els['h-banner-t'].innerHTML = html;
  };
  HUD.syncLaunchAll = function () {
    const b = document.getElementById('h-launchall');
    b.classList.toggle('on', HUD.launchAll);
    b.querySelector('span').textContent = HUD.launchAll ? 'ON' : 'OFF';
    if (HUD.mode && HUD.mode.kind === 'weapon') HUD.weaponClick(HUD.mode.w), HUD.weaponClick(HUD.mode.w);
  };
  HUD.syncRatio = function () {
    els['h-ratio-pct'].textContent = Math.round(HUD.ratio * 100) + '%';
    root.querySelectorAll('.presets button').forEach((b) => b.classList.toggle('on', Number(b.dataset.r) === HUD.ratio));
  };

  // ---------------- radial menu ----------------
  HUD.onRightClick = function (e) {
    const S = G.S, p = G.player();
    HUD.updateHover(e.clientX, e.clientY);
    const H = MP.Render.hover;
    if (!S || H.t < 0) return;
    if (HUD.mode) { HUD.clearMode(); return; }
    if (MP.Render.selectedShip && !World.land[H.t]) { MP.Naval.assignPatrol(MP.Render.selectedShip, H.wx, H.wy); MP.Render.selectedShip = null; HUD.toast('Patrol assigned', 'info'); return; }
    const o = S.owner[H.t];
    if (!o) return;
    HUD.openRadial(o, e.clientX, e.clientY, H.t);
  };
  HUD.openRadial = function (o, x, y, t) {
    const S = G.S, p = G.player(), n = S.nations[o];
    const rad = els['h-radial'];
    const self = p && o === p.id;
    const watch = !p || S.opts.mode === 'watch';
    const allied = p && G.isAllied(p.id, o);
    const opts = [];
    opts.push({ id: 'info', label: 'Info', icon: 'radar' });
    if (!self && !watch && allied) {
      const team = n.team && n.team === p.team;
      opts.push({ id: 'gift', label: 'Gift', icon: 'troops' });
      opts.push({ id: 'askTroops', label: 'Ask Troops', icon: 'troops' });
      opts.push({ id: 'askCredits', label: 'Ask Credits', icon: 'coin' });
      if (n.puppet) opts.push({ id: 'cede', label: 'Cede ' + Math.round(MP.Diplo.cedeOdds(p, n) * 100) + '%', icon: 'capital' });
      else opts.push({ id: 'ally', label: team ? (n.partner ? 'Party' : 'Team') : 'Break', icon: 'flag', dis: team });
      opts.push({ id: 'embargo', label: p.embargo.has(o) ? 'Lift' : 'Embargo', icon: 'coin' });
    } else if (!self && !watch) {
      const hasFriends = G.alive().some((x) => x.id !== p.id && x.ai && G.isAllied(x.id, p.id));
      opts.push({ id: 'attack', label: 'Attack', icon: 'jet' });
      opts.push({ id: 'boat', label: 'Boat', icon: 'warship' });
      opts.push({ id: 'ally', label: 'Ally', icon: 'flag' });
      opts.push({ id: 'truce', label: 'Truce', icon: 'shield', dis: G.hasTruce(p.id, o) });
      opts.push({ id: 'target', label: p.targetId === o ? 'Untarget' : 'Target', icon: 'nuke', dis: !hasFriends });
      opts.push({ id: 'embargo', label: p.embargo.has(o) ? 'Lift' : 'Embargo', icon: 'coin' });
    }
    opts.push({ id: 'focus', label: 'Focus', icon: 'capital' });
    const R = 92;
    rad.innerHTML = `<div class="rchip">${MP.Flags.img(n.flag, 'flag sm')} ${U.esc(n.name)}</div><button class="rc" data-id="close">✕</button>` +
      opts.map((op, i) => {
        const a = -Math.PI / 2 + i * 2 * Math.PI / opts.length;
        return `<button class="ropt ${op.dis ? 'dis' : ''}" data-id="${op.id}" style="left:${Math.cos(a) * R}px;top:${Math.sin(a) * R}px"><img src="${MP.Icons.url(op.icon, '#ece6cf', 32)}"><span>${op.label}</span></button>`;
      }).join('');
    rad.style.left = U.clamp(x, 130, window.innerWidth - 130) + 'px'; rad.style.top = U.clamp(y, 130, window.innerHeight - 130) + 'px';
    rad.style.display = '';
    MP.SFX.play('open');
    rad.onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const id = b.dataset.id;
      if (b.classList.contains('dis')) { MP.SFX.play('error'); return; }
      HUD.closeRadial();
      HUD.radialAction(id, o, t);
    };
  };
  HUD.closeRadial = function (target) {
    const rad = els['h-radial'];
    if (target && rad.contains(target)) return;
    if (rad.style.display !== 'none') rad.style.display = 'none';
  };
  HUD.radialAction = function (id, o, t) {
    const S = G.S, p = G.player(), n = S.nations[o];
    switch (id) {
      case 'info': HUD.showNationInfo(o); break;
      case 'focus': { const c = n.label || { x: n.capX, y: n.capY }; MP.Render.centerOn(c.x, c.y, Math.max(3, MP.Render.cam.z)); MP.Render.ping(n.capX, n.capY, n.color); break; }
      case 'attack': HUD.orderAttack(o, t); break;
      case 'boat': {
        const r = MP.Naval.launchTransport(p, t, p.troops * HUD.ratio);
        if (!r.ok) { HUD.toast(r.reason, 'bad'); MP.SFX.play('error'); } else HUD.floatOrder(`Transport underway with ${U.fmtK(r.ship.troops)}`);
        break;
      }
      case 'ally':
        if (G.isAllied(p.id, o)) HUD.confirm(`Break your alliance with ${n.name}?`, 'The world will remember. You will be flagged as a traitor.', () => MP.Diplo.breakAlliance(p, n, true));
        else MP.Diplo.requestAlliance(p, n);
        break;
      case 'truce': MP.Diplo.requestTruce(p, n); break;
      case 'embargo': {
        const on = MP.Diplo.toggleEmbargo(p, n);
        MP.Game.wire('CABLE', on ? `EMBARGO ON ${n.name}` : `EMBARGO ON ${n.name} LIFTED`, 'embargo');
        if (on) MP.Game.notify('diplo.embargo_them', { nation: n.name });
        break;
      }
      case 'gift': HUD.giftDialog(n); break;
      case 'askTroops': MP.Diplo.requestAid(p, n, 'troops'); break;
      case 'askCredits': MP.Diplo.requestAid(p, n, 'credits'); break;
      case 'target': MP.Diplo.setTarget(p, n); HUD.refresh(); break;
      case 'cede': HUD.confirm(`Demand that ${n.name} cede?`, `${Math.round(MP.Diplo.cedeOdds(p, n) * 100)}% chance it signs everything over to you. If it refuses, it declares independence, goes to war with you and courts your enemies. Each gift you send it adds 5%.`, () => MP.Diplo.requestCede(p, n)); break;
    }
  };

  HUD.giftDialog = function (n) {
    const p = G.player();
    HUD.modal(`<div class="mh"><span class="tag">LOGISTICS</span><h2>Gift to ${U.esc(n.name)}</h2></div>
      <div class="gift-row"><button class="btn" data-k="troops" data-f="0.1">10% troops (${U.fmtK(p.troops * 0.1)})</button><button class="btn" data-k="troops" data-f="0.25">25% troops (${U.fmtK(p.troops * 0.25)})</button></div>
      <div class="gift-row"><button class="btn" data-k="credits" data-f="0.1">10% credits (${U.fmtK(p.credits * 0.1)})</button><button class="btn" data-k="credits" data-f="0.25">25% credits (${U.fmtK(p.credits * 0.25)})</button></div>`,
    (box, close) => {
      box.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-k]'); if (!b) return;
        const k = b.dataset.k, f = Number(b.dataset.f);
        const amt = MP.Diplo.gift(p, n, k, (k === 'troops' ? p.troops : p.credits) * f);
        if (amt) { MP.Game.wire('CABLE', `YOU SEND ${U.fmtK(amt)} ${k.toUpperCase()} TO ${n.name}`, 'good'); MP.SFX.play('send'); }
        close();
      });
    });
  };

  HUD.showNationInfo = function (o) {
    const S = G.S, n = S.nations[o], p = G.player();
    const doc = C.DOCTRINES.find((d) => d.id === n.doctrine);
    const rel = p && p.id !== o ? G.rel(o, p.id) : null;
    const relTxt = rel == null ? '' : rel > 40 ? 'FRIENDLY' : rel > 10 ? 'CORDIAL' : rel > -20 ? 'NEUTRAL' : rel > -50 ? 'HOSTILE' : 'HATEFUL';
    const allies = Array.from(n.allies).map((a) => S.nations[a]).filter((x) => x && x.alive);
    const wars = Array.from(n.wars).map((a) => S.nations[a]).filter((x) => x && x.alive);
    const cnt = (t) => n.st[t].reduce((a, s) => a + s.level, 0);
    const research = Object.keys(n.research);
    const odds = p && p.id !== o && !G.isAllied(p.id, o) ? Math.round(MP.Diplo.allianceOdds(p, n) * 100) : null;
    HUD.modal(`<div class="mh"><span class="tag">DOSSIER · ${n.isPlayer ? 'YOU' : n.partner ? 'PARTNER' : 'FOREIGN NATION'}</span>
      <div class="ni-head">${MP.Flags.img(n.flag, 'flag lg')}<div><h2>${U.esc(n.name)}</h2><div class="dim">${doc ? doc.name.toUpperCase() : ''} ${n.ai ? '· ' + n.personality.toUpperCase() : ''} ${n.traitorUntil > S.t ? '· <span class="red">TRAITOR</span>' : ''}</div></div></div></div>
      <div class="ni-grid">
        <div><span>Rank</span><b>#${n.rank || '-'}</b></div><div><span>Land</span><b>${U.fmtPct(100 * n.tiles / S.landTotal)}</b></div>
        <div><span>Troops</span><b>${U.fmtK(n.troops)}</b></div><div><span>Credits</span><b>${U.fmtK(n.credits)}</b></div>
        <div><span>Cities</span><b>${cnt('city')}</b></div><div><span>Factories</span><b>${cnt('factory')}</b></div>
        <div><span>Forts</span><b>${cnt('fort')}</b></div><div><span>Silos</span><b>${cnt('silo')}</b></div>
        <div><span>Defences</span><b>${cnt('sam') + cnt('abm') + cnt('laser') + cnt('aegis')}</b></div><div><span>Radar</span><b>${cnt('radar')}</b></div>
        ${rel != null ? `<div><span>Attitude</span><b>${relTxt}</b></div>` : ''}${odds != null ? `<div><span>Alliance odds</span><b>${odds}%</b></div>` : ''}
      </div>
      <div class="ni-list"><span>Arsenal</span>${research.length ? research.join(' · ') : '<i class="dim">none known</i>'}</div>
      <div class="ni-list"><span>Allies</span>${allies.length ? allies.map((a) => MP.Flags.img(a.flag, 'flag sm') + ' ' + U.esc(a.name)).join(', ') : '<i class="dim">none</i>'}</div>
      <div class="ni-list"><span>At war with</span>${wars.length ? wars.slice(0, 8).map((a) => U.esc(a.name)).join(', ') : '<i class="dim">nobody</i>'}</div>`);
  };

  // ---------------- offers / council / directives ----------------
  HUD.renderOffers = function () {
    const S = G.S, box = els['h-offers'];
    if (!S) { box.innerHTML = ''; return; }
    box.innerHTML = '';
    for (const of of S.offers.slice(-3)) {
      const n = S.nations[of.from];
      if (!n) continue;
      const el = h('div', { class: 'offer panel brk' },
        h('div', { class: 'of-l' }, h('img', { src: MP.Icons.url(of.kind === 'ally' ? 'flag' : 'shield', '#3ee6ff', 32), class: 'ico' }),
          h('div', null, h('div', { class: 'of-n', html: MP.Flags.img(n.flag, 'flag sm') + ' ' + U.esc(n.name) }), h('div', { class: 'of-k' }, of.kind === 'ally' ? 'OFFERS AN ALLIANCE' : 'OFFERS A TRUCE'),
            h('div', { class: 'of-bar' }, h('i', { 'data-offer': '1' })))),
        h('button', { class: 'btn accept', onclick: () => MP.Diplo.answerOffer(of, true) }, '✔ ACCEPT'),
        h('button', { class: 'btn decline', onclick: () => MP.Diplo.answerOffer(of, false) }, '✕ DECLINE'),
        h('button', { class: 'btn sm info', title: 'Dossier', onclick: () => HUD.showNationInfo(n.id) }, 'i'));
      el._offer = of;
      box.appendChild(el);
    }
  };

  HUD.openCouncil = function (res) {
    const el = els['h-council'];
    el.style.display = '';
    el.innerHTML = `<div class="ph"><span class="t">GLOBAL COUNCIL · SESSION</span><span id="cc-t"></span></div>
      <h3>${U.esc(res.name)}</h3><p>${U.esc(res.desc)}</p>${res.targetName ? `<p class="dim">Subject: <b>${U.esc(res.targetName)}</b></p>` : ''}
      <div class="cc-bar"><i id="cc-bar"></i></div>
      <div class="cc-votes">${G.player() && G.player().alive && G.S.opts.mode !== 'watch' ? `<button class="btn yes" data-v="yes">AYE</button><button class="btn no" data-v="no">NAY</button><button class="btn" data-v="abstain">ABSTAIN</button>` : '<span class="dim">OBSERVING</span>'}</div>`;
    el.onclick = (e) => {
      const b = e.target.closest('button[data-v]'); if (!b) return;
      MP.Diplo.playerVote(b.dataset.v);
      el.querySelectorAll('button[data-v]').forEach((x) => x.classList.toggle('on', x === b));
    };
    el._res = res;
  };
  HUD.closeCouncil = function (res, passed) {
    const el = els['h-council'];
    el.innerHTML = `<div class="ph"><span class="t">GLOBAL COUNCIL · RESULT</span></div><h3>${U.esc(res.name)}</h3>
      <div class="cc-result ${passed ? 'pass' : 'fail'}">${passed ? 'PASSED' : 'FAILED'} <b>${res.yes}</b> – <b>${res.no}</b></div>`;
    el._res = null;
    setTimeout(() => { if (!el._res) el.style.display = 'none'; }, 5000);
  };

  HUD.offerDirective = function () {
    const S = G.S;
    const taken = new Set(G.player().directives);
    const pool = C.DIRECTIVES.filter((d) => !taken.has(d.id));
    const pick = [];
    while (pick.length < 3 && pool.length) pick.push(pool.splice(S.rng.int(pool.length), 1)[0]);
    HUD.modal(`<div class="mh"><span class="tag">FIELD DIRECTIVE</span><h2>Choose a directive</h2><p class="dim">Your reach has grown. Commit to one standing order for the rest of the war.</p></div>
      <div class="cards">${pick.map((d) => `<button class="card" data-id="${d.id}"><b>${d.name}</b><span>${d.desc}</span></button>`).join('')}</div>`,
    (box, close) => {
      box.addEventListener('click', (e) => {
        const b = e.target.closest('.card'); if (!b) return;
        const p = G.player();
        p.directives.push(b.dataset.id); p.mods = G.computeMods(p);
        MP.Game.wire('ADVISOR', `DIRECTIVE ADOPTED · ${C.DIRECTIVES.find((d) => d.id === b.dataset.id).name.toUpperCase()}`, 'advisor');
        MP.SFX.play('researchDone');
        close();
      });
    }, { noClose: true });
  };

  // ---------------- generic modal / confirm / toast / tooltip ----------------
  HUD.modal = function (html, setup, opts) {
    const wrap = h('div', { class: 'modal-wrap' });
    const box = h('div', { class: 'modal panel brk', html: html + (opts && opts.noClose ? '' : '<button class="btn icon mclose">✕</button>') });
    wrap.appendChild(box);
    document.getElementById('modal-root').appendChild(wrap);
    MP.SFX.play('open');
    const close = () => { wrap.remove(); MP.SFX.play('close'); };
    const x = box.querySelector('.mclose');
    if (x) x.addEventListener('click', close);
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap && !(opts && opts.noClose)) close(); });
    if (setup) setup(box, close);
    return { box, close };
  };
  HUD.confirm = function (title, text, yes) {
    HUD.modal(`<div class="mh"><span class="tag">CONFIRM</span><h2>${U.esc(title)}</h2><p class="dim">${U.esc(text)}</p></div><div class="row-btns"><button class="btn danger" data-y>CONFIRM</button><button class="btn" data-n>CANCEL</button></div>`,
      (box, close) => { box.querySelector('[data-y]').onclick = () => { close(); yes(); }; box.querySelector('[data-n]').onclick = close; });
  };
  HUD.toast = function (text, kind) {
    const box = els['h-toasts'];
    if (!box) return;
    const el = h('div', { class: 'toast ' + (kind || '') }, text);
    box.appendChild(el);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => el.classList.add('out'), 2400);
    setTimeout(() => el.remove(), 3000);
  };
  HUD.showTip = function (anchor, html, dir) {
    const tip = els['h-tip'];
    tip.innerHTML = html; tip.style.display = '';
    const r = anchor.getBoundingClientRect();
    if (dir === 'up') {
      tip.style.left = Math.max(8, Math.min(window.innerWidth - 290, r.left + r.width / 2 - 140)) + 'px';
      tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
    } else {
      tip.style.left = Math.max(8, Math.min(window.innerWidth - 290, r.left - 290)) + 'px';
      tip.style.top = Math.max(8, r.top - 10) + 'px';
    }
  };
  HUD.hideTip = function () { els['h-tip'].style.display = 'none'; };
  HUD.savedIndicator = function (ok) { HUD.toast(ok ? 'Match saved' : 'Save failed — storage blocked', ok ? 'good' : 'bad'); };
  HUD.flashDefcon = function () { els['h-defcon'].classList.remove('flash'); void els['h-defcon'].offsetWidth; els['h-defcon'].classList.add('flash'); };

  // ---------------- wire ----------------
  const TAG_ICON = { FLASH: 'emp', CABLE: 'flag', RADAR: 'radar', IMINT: 'shield', OSINT: 'flag', ADVISOR: 'radar', COUNCIL: 'capital' };
  HUD.pushWire = function (item) {
    const box = els['h-wire'];
    if (!box) return;
    const el = h('div', { class: 'wi ' + item.cls },
      h('img', { class: 'ico', src: MP.Icons.url(TAG_ICON[item.tag] || 'flag', '#8d8670', 32) }),
      h('span', { class: 'wt' }, U.fmtTime(MP.Game.elapsed ? Math.max(0, item.t - (G.S.playStart || 0)) : item.t)),
      h('span', { class: 'wtag tag-' + item.tag.toLowerCase() }, item.tag === 'ADVISOR' ? 'VESPER' : item.tag),
      h('span', { class: 'wx' }, item.text));
    box.appendChild(el);
    while (box.children.length > 7) box.firstChild.remove();
  };

  // ---------------- per-frame / periodic refresh ----------------
  HUD.startMatch = function () {
    document.body.classList.add('in-match');
    root.style.display = '';
    els['h-wire'].innerHTML = '';
    els['h-offers'].innerHTML = '';
    els['h-council'].style.display = 'none';
    HUD.mode = null; HUD.banner(null);
    HUD.ratio = MP.settings.get('ratio', 0.25);
    HUD.syncRatio(); HUD.syncSpeed(); HUD.syncLaunchAll();
    const watch = G.S.opts.mode === 'watch';
    document.body.classList.toggle('watch', watch);
    MP.bus.off('advisor:line', HUD._onLine);
    HUD._onLine = (d) => { if (d && d.text && d.priority >= 1) HUD.pushWire({ t: G.S ? G.S.t : 0, tag: 'ADVISOR', text: d.text.toUpperCase(), cls: 'advisor' }); };
    MP.bus.on('advisor:line', HUD._onLine);
  };
  HUD.stopMatch = function () {
    document.body.classList.remove('in-match', 'watch');
    root.style.display = 'none';
    document.getElementById('modal-root').innerHTML = '';
  };
  HUD.syncSpeed = function () {
    els['h-speed'].querySelectorAll('button').forEach((b) => {
      const sp = Number(b.dataset.sp);
      b.classList.toggle('on', sp === 0 ? MP.Game.paused : (!MP.Game.paused && MP.Game.speed === sp));
    });
    els['h-pause'].style.display = MP.Game.paused && MP.Game.running ? '' : 'none';
  };

  HUD.syncSlots = function () {
    const p = G.player();
    if (!p) return;
    for (const type of C.BUILD_ORDER.concat(C.DEFENSE_ORDER)) {
      const c = G.structCost(p, type);
      const el = document.getElementById('cost-' + type);
      if (!el) continue;
      el.textContent = U.fmtK(c.credits) + (c.u ? '·' + c.u + 'U' : '');
      const slot = el.parentElement;
      const afford = p.credits >= c.credits && p.uranium >= c.u;
      slot.classList.toggle('poor', !afford);
      slot.classList.toggle('on', !!(HUD.mode && HUD.mode.kind === 'build' && HUD.mode.type === type));
    }
    for (const w of C.WEAPON_ORDER) {
      const slot = root.querySelector(`.wslot[data-w="${w}"]`);
      const def = C.WEAPON[w];
      const unlocked = G.S.defcon <= def.defcon && G.S.opts.nukes !== false;
      const res = !!p.research[w];
      const resing = p.researching && p.researching.w === w;
      slot.classList.toggle('locked', !res);
      slot.classList.toggle('sealed', !unlocked);
      slot.classList.toggle('on', !!(HUD.mode && HUD.mode.kind === 'weapon' && HUD.mode.w === w));
      const cEl = document.getElementById('wc-' + w);
      const prog = document.getElementById('wp-' + w);
      if (res) {
        const lc = MP.Weapons.launchCost(p, w);
        cEl.textContent = U.fmtK(lc.credits) + (lc.u ? '·' + lc.u + 'U' : '');
        slot.classList.toggle('poor', p.credits < lc.credits || p.uranium < lc.u);
        prog.style.width = '0';
      } else if (resing) {
        cEl.textContent = Math.ceil(p.researching.total - p.researching.t) + 's';
        prog.style.width = (100 * p.researching.t / p.researching.total) + '%';
      } else {
        const rc = MP.Weapons.researchCost(p, w);
        cEl.textContent = unlocked ? (rc.u ? rc.u + 'U' : U.fmtK(rc.credits)) : 'D' + def.defcon;
        slot.classList.toggle('poor', p.credits < rc.credits || p.uranium < rc.u);
        prog.style.width = '0';
      }
    }
    const ready = p.st.silo.reduce((a, s) => a + (G.isActive(s) ? s.ready : 0), 0);
    document.getElementById('h-silos').textContent = `${p.st.silo.length} SILO${p.st.silo.length === 1 ? '' : 'S'} · ${ready} READY`;
  };

  function clockFace(sec) {
    // small analog face: minute hand toward 12 as clock drops
    const frac = U.clamp(sec / (12 * 60), 0, 1);
    const ang = -frac * Math.PI * 2 * (12 / 60) * 5; // 12 min → 60° from top
    const x = 8 + Math.sin(ang) * 5.5, y = 8 - Math.cos(ang) * 5.5;
    const col = sec < 120 ? '#ff4433' : sec < 300 ? '#ffb000' : '#ece6cf';
    return `<svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="${col}" stroke-width="1.3"/><line x1="8" y1="8" x2="8" y2="2.6" stroke="${col}" stroke-width="1.3"/><line x1="8" y1="8" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#ffd21f" stroke-width="1.1"/></svg>`;
  }

  HUD.frame = function (dt) {
    if (!MP.Game.running || !G.S) return;
    refreshT -= dt;
    // offer timers (smooth)
    const S = G.S;
    els['h-offers'].querySelectorAll('.offer').forEach((el) => {
      const of = el._offer; if (!of) return;
      const bar = el.querySelector('i[data-offer]');
      if (bar) bar.style.width = (100 * Math.max(0, of.until - S.t) / of.total) + '%';
    });
    if (S.council.active) { const b = document.getElementById('cc-bar'); if (b) b.style.width = (100 * Math.max(0, S.council.active.closes - S.t) / S.council.active.total) + '%'; const t = document.getElementById('cc-t'); if (t) t.textContent = U.fmtTime(S.council.active.closes - S.t); }
    if (refreshT > 0) return;
    refreshT = 0.15;
    HUD.refresh();
  };

  HUD.refresh = function () {
    const S = G.S, p = G.player(), Game = MP.Game;
    // status
    const d = S.defcon;
    els['h-defcon'].textContent = 'DEFCON ' + d;
    els['h-defcon'].className = 'defcon d' + d;
    const months = Math.floor(S.t / C.MONTH_SECONDS);
    els['h-date'].textContent = U.MONTHS[months % 12] + ' ' + (C.START_YEAR + Math.floor(months / 12));
    els['h-match'].textContent = S.phase === 'spawn' ? U.fmtTime(S.matchSeconds) : U.fmtTime(Game.matchLeft());
    const alive = G.alive().length;
    els['h-alive'].textContent = alive;
    els['h-clock'].textContent = U.fmtTime(S.clock);
    els['h-clock'].className = S.clock < 120 ? 'red' : S.clock < 300 ? 'amber' : '';
    els['h-clockface'].innerHTML = clockFace(S.clock);
    if (S.phase === 'spawn') { els['h-peace'].textContent = U.fmtTime(S.spawnLeft); els['h-peace-wrap'].title = 'Choose your spawn'; }
    else if (S.defcon === 5 && S.opts.nukes !== false) { els['h-peace'].textContent = U.fmtTime(Game.peaceLeft()); els['h-peace-wrap'].title = 'Peace timer — weapons unlock at DEFCON 4'; }
    else if (S.opts.council) { els['h-peace'].textContent = S.council.active ? 'VOTE' : U.fmtTime(S.council.next); els['h-peace-wrap'].title = 'Next Global Council session'; els['h-peace-ico'].src = MP.Icons.url('capital', '#ffd21f', 32); }
    else els['h-peace'].textContent = '—';
    // spawn banner
    const pupN = S.puppetId ? S.nations[S.puppetId] : null;
    if (S.phase === 'spawn' && p && !HUD.mode) {
      if (pupN && p.spawned) HUD.banner(`<b>PLACE YOUR PUPPET-STATE</b> · click land for ${U.esc(pupN.name)}${pupN.spawned ? ' (click again to move it)' : ''} · shift-click moves your nation · ${Math.ceil(S.spawnLeft)}s`);
      else HUD.banner(`<b>CHOOSE YOUR GROUND</b> · click land to place your nation · ${Math.ceil(S.spawnLeft)}s`);
    }
    else if (S.phase === 'play' && !HUD.mode && els['h-banner'].style.display !== 'none' && els['h-banner-t'].textContent.startsWith('CHOOSE')) HUD.banner(null);
    // land
    const pct = p ? 100 * p.tiles / S.landTotal : 0;
    const bloc = (S.blocSize || 1) > 1 ? S.blocPct || 0 : pct;
    els['h-landbar'].style.width = U.clamp(bloc / S.winPct * 100, 0, 100) + '%';
    els['h-landpct'].textContent = (S.blocSize || 1) > 1 ? U.fmtPct(pct) + ' · ⛓' + U.fmtPct(bloc) : U.fmtPct(pct);
    els['h-landpct'].title = (S.blocSize || 1) > 1 ? `You hold ${U.fmtPct(pct)}; your alliance holds ${U.fmtPct(bloc)}. An alliance must take the whole world; any other bloc reaching ${S.winPct}% ends the match.` : `First to ${S.winPct}% of the world wins.`;
    root.querySelector('.ms.m10').style.left = (10 / S.winPct * 100) + '%';
    root.querySelector('.ms.m25').style.left = (25 / S.winPct * 100) + '%';
    // readout
    const H = MP.Render.hover;
    if (H.t >= 0) {
      const [lon, lat] = World.toLonLat(H.x + 0.5, H.y + 0.5);
      els['h-coord'].textContent = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;
      if (World.land[H.t]) {
        els['h-terrain'].textContent = World.terrainName(H.t);
        const dif = World.difficulty(H.t);
        els['h-pips'].innerHTML = [0, 1, 2].map((i) => `<i class="${i < dif ? 'on' : ''}"></i>`).join('');
      } else { els['h-terrain'].textContent = World.ocean[H.t] ? 'SEA' : 'LAKE'; els['h-pips'].innerHTML = ''; }
      const o = S.owner[H.t];
      if (o) {
        const n = S.nations[o];
        const soft = G.isSoft(H.t) || MP.Weapons.inFallout(H.x, H.y);
        const atWar = p && n.wars.has(p.id);
        const allies = Array.from(n.allies).map((a) => S.nations[a]).filter((x) => x && x.alive).slice(0, 6);
        els['h-ro-nation'].innerHTML = `${MP.Flags.img(n.flag, 'flag sm')} <b style="color:${U.rgb(U.mix(n.color, [255, 255, 255], 0.35))}">${U.esc(n.name)}</b>` +
          (atWar ? ' <span class="red">⊕</span>' : '') + ` <span class="dim">≈${U.fmtK(n.troops)}</span> <span class="dim">▣ ${U.fmtK(n.tiles)}</span> ` +
          (soft ? '<span class="soft">SOFT ×1</span>' : `<span class="dug">DUG IN ×${C.DUG_IN_MULT}</span>`) +
          (allies.length ? `<div class="ro-allies">${allies.map((a) => MP.Flags.img(a.flag, 'flag xs')).join('')}</div>` : '');
      } else els['h-ro-nation'].innerHTML = World.land[H.t] ? '<span class="dim">UNCLAIMED LAND</span>' : '';
    }
    // leaderboard
    const al = G.alive().sort((a, b) => b.tiles - a.tiles);
    let rows = '';
    const top = al.slice(0, 8);
    const pRank = p ? al.indexOf(p) : -1;
    const row = (n, i) => `<div class="lbr ${n === p ? 'me' : ''} ${n.partner ? 'partner' : ''}"><span>${n === p ? '›' : ''} ${i + 1}</span><span class="nm">${MP.Flags.img(n.flag, 'flag xs')} ${U.esc(n.name)}${n.puppet ? ' <i>PUPPET</i>' : n.isPlayer || n.partner ? ' <i>L' + (MP.Menu ? MP.Menu.level() : 1) + '</i>' : ''}</span><span>${U.fmtPct(100 * n.tiles / S.landTotal)}</span><span>${U.fmtK(n.troops)}</span></div>`;
    top.forEach((n, i) => { rows += row(n, i); });
    if (pRank >= 8) rows += row(p, pRank);
    els['h-lb-rows'].innerHTML = rows;
    // attacks
    if (p) {
      const mine = S.attacks.filter((a) => a.from === p.id && !a.done);
      els['h-att-count'].textContent = mine.length + ' OUT';
      els['h-att-rows'].innerHTML = mine.map((a) => {
        const tn = a.to ? S.nations[a.to] : null;
        return `<div class="atr"><span class="nm">${tn ? MP.Flags.img(tn.flag, 'flag xs') + ' ' + U.esc(tn.name) : '<img class="ico" src="' + MP.Icons.url('flag', '#8d8670', 32) + '"> UNCLAIMED LAND'}</span><span class="tr">${U.fmtK(a.troops)}</span><button class="btn sm" data-recall="${a.id}">RECALL</button></div>`;
      }).join('') + S.ships.filter((s) => s.owner === p.id && s.kind === 'transport').map((s) => `<div class="atr"><span class="nm">⛴ TRANSPORT → ${s.target ? U.esc(S.nations[s.target].name) : 'COAST'}</span><span class="tr">${U.fmtK(s.troops)}</span><span></span></div>`).join('');
      const incoming = S.attacks.filter((a) => a.to === p.id && !a.done);

  Menu.miniWorld = function () {

    const cv = document.createElement('canvas'); cv.width = 180; cv.height = 100;
    const c = cv.getContext('2d'); const img = c.createImageData(180, 100);
    for (let y = 0; y < 100; y++) for (let x = 0; x < 180; x++) {

      if (MP.World.land[t]) { img.data[i] = 10; img.data[i + 1] = 10; img.data[i + 2] = 8; img.data[i + 3] = 255; }

  function drawLoadoutPreview(cv, lo) {
    if (!cv) return;
    const c = cv.getContext('2d');
    const tc = C.TERRITORY_COLORS.find((t) => t.id === lo.territory) || C.TERRITORY_COLORS[0];
    c.fillStyle = '#2c3a22'; c.fillRect(0, 0, cv.width, cv.height);
    c.save(); c.beginPath(); c.ellipse(cv.width / 2, cv.height / 2, cv.width * 0.42, cv.height * 0.38, 0.1, 0, 7); c.clip();
    for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
      let a = 0.4, col = tc.rgb;
      switch (lo.pattern) {
        case 'hazard': if (((x + y) >> 3) & 1) { col = [20, 18, 12]; a = 0.6; } else a = 0.75; break;
        case 'grid': a = (x % 6 === 0 || y % 6 === 0) ? 0.8 : 0.35; break;
        case 'dots': a = (x % 4 === 0 && y % 4 === 0) ? 0.9 : 0.35; break;
        case 'chevron': a = ((x + Math.abs((y % 8) - 4)) % 8) < 2 ? 0.8 : 0.35; break;
        case 'scan': a = y % 3 === 0 ? 0.8 : 0.35; break;
      }
      c.fillStyle = U.rgb(col, a); c.fillRect(x, y, 1, 1);
    }
    c.restore();
    c.strokeStyle = U.rgb(tc.rgb); c.lineWidth = 2; c.beginPath(); c.ellipse(cv.width / 2, cv.height / 2, cv.width * 0.42, cv.height * 0.38, 0.1, 0, 7); c.stroke();
  }

        mc.beginPath(); mc.moveTo(lo.missile === 'comet' ? 70 : 20, lo.missile === 'comet' ? 38 : 95); mc.quadraticCurveTo(80, 0, 130, 40); mc.stroke(); mc.setLineDash([]);

            const req = k.req ? C.SKILLS.find((x) => x.id === k.req) : null;
            return `<button class="sk ${st}" data-sk="${k.id}"><b>${k.name.toUpperCase()}</b><i>${k.cost} PT${k.cost > 1 ? 'S' : ''}</i><span>${k.desc}</span>${req && !reqOk ? `<em>REQUIRES ${req.name.toUpperCase()}</em>` : ''}</button>`;

        if (P.skills.includes(k.id)) {
          // refund (and anything that depends on it)
          const drop = new Set([k.id]); let grew = true;
          while (grew) { grew = false; for (const x of C.SKILLS) if (x.req && drop.has(x.req) && !drop.has(x.id) && P.skills.includes(x.id)) { drop.add(x.id); grew = true; } }
          P.skills = P.skills.filter((id) => !drop.has(id));
          MP.SFX.play('close');
        } else {
          if (k.req && !P.skills.includes(k.req)) { MP.SFX.play('error'); return; }

      });
